# Adfix — nginx reverse proxy + SSL
# Kurulum: sudo cp nginx-adfix.conf /etc/nginx/sites-available/adfix
#          sudo ln -sf /etc/nginx/sites-available/adfix /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

# ─── HTTP → HTTPS yönlendirme (tüm domainler) ───
server {
    listen 80;
    listen [::]:80;
    server_name adfixapp.com.tr www.adfixapp.com.tr
                adfixapp.info   www.adfixapp.info
                adfixapp.online www.adfixapp.online;

    # Let's Encrypt doğrulama
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://adfixapp.com.tr$request_uri;
    }
}

# ─── Ana domain: adfixapp.com.tr ───
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adfixapp.com.tr www.adfixapp.com.tr;

    ssl_certificate     /etc/letsencrypt/live/adfixapp.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adfixapp.com.tr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Güvenlik başlıkları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logo/görsel data URI'leri büyük olabilir
    client_max_body_size 2M;

    # WebSocket desteği (ileride canlı mutfak ekranı için)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # QR SVG ve menü verisi hızlı dönsün
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Statik dosyalar için cache (favicon, olası gelecek asset'ler)
    location ~* \.(ico|svg|png|jpg|jpeg|gif|css|js|woff2?)$ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# ─── Diğer domainler → ana domain'e yönlendir ───
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adfixapp.info   www.adfixapp.info
                adfixapp.online www.adfixapp.online;

    ssl_certificate     /etc/letsencrypt/live/adfixapp.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adfixapp.com.tr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://adfixapp.com.tr$request_uri;
}
