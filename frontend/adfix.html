    r = await GET(`/rapor/ozet?bas=${bas}&bit=${bit}`);
    gs = await GET('/rapor/gun-sonu/onizleme');
  } catch (e) { return kotu(e.message); }

  const enCok = Math.max(1, ...r.urunler.map(u => u.adet));
  const odemeToplam = Object.values(r.odeme).reduce((a, b) => a + b, 0);

  document.getElementById('sayfa').innerHTML = `
    <div class="kart-sira">
      <div class="ozet-kart vurgu"><div class="etiket">Net Ciro</div>
        <div class="deger">${tl(r.net_kurus)}</div>
        <div class="alt">${r.adisyon_sayisi} adisyon · ${r.kisi_sayisi} kişi</div></div>
      <div class="ozet-kart"><div class="etiket">Ortalama Adisyon</div>
        <div class="deger">${tl(r.ortalama_adisyon)}</div>
        <div class="alt">kişi başı ${tl(r.kisi_basi)}</div></div>
      <div class="ozet-kart"><div class="etiket">İskonto + İkram</div>
        <div class="deger" style="color:var(--sari)">${tl(r.iskonto_kurus + r.ikram_kurus)}</div>
        <div class="alt">iskonto ${tlSade(r.iskonto_kurus)} · ikram ${tlSade(r.ikram_kurus)}</div></div>
      <div class="ozet-kart"><div class="etiket">İptaller</div>
        <div class="deger" style="color:var(--kirmizi)">${tl(r.iptal_kurus)}</div>
        <div class="alt">${r.iptal_adisyon} adisyon iptali</div></div>
    </div>

    <div class="bolum"><h3>${ik('credit-card')} Ödeme Dağılımı <small>toplam ${tl(odemeToplam)}</small></h3>
      <div class="kart-sira">
        ${Object.entries(r.odeme).map(([t, v]) => `<div class="ozet-kart">
          <div class="etiket">${odemeIk(t)} ${ODEME_AD[t]}</div>
          <div class="deger" style="font-size:19px">${tl(v)}</div>
          <div class="alt">%${odemeToplam ? Math.round(v * 100 / odemeToplam) : 0}</div></div>`).join('')}
      </div></div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px">
      <div class="bolum"><h3>${ik('flame')} En Çok Satanlar</h3>
        <div class="tablo-sar"><table>
          <thead><tr><th>Ürün</th><th class="orta">Adet</th><th class="sag">Tutar</th></tr></thead>
          <tbody>${r.urunler.length ? r.urunler.map(u => `<tr>
            <td><div>${kacis(u.ad)}</div>
              <div style="height:3px;background:var(--ana);border-radius:2px;margin-top:4px;
                width:${Math.round(u.adet * 100 / enCok)}%"></div></td>
            <td class="orta"><b>${u.adet}</b></td>
            <td class="sag para">${tl(u.tutar)}</td></tr>`).join('')
            : `<tr><td colspan="3" style="text-align:center;padding:22px;color:var(--gri)">Veri yok</td></tr>`}
          </tbody></table></div></div>

      <div class="bolum"><h3>${ik('users')} Personel Performansı</h3>
        <div class="tablo-sar"><table>
          <thead><tr><th>Personel</th><th class="orta">Adisyon</th><th class="sag">Ciro</th></tr></thead>
          <tbody>${r.personel.length ? r.personel.map(p => `<tr>
            <td>${kacis(p.ad)}</td><td class="orta">${p.adisyon}</td>
            <td class="sag para">${tl(p.tutar)}</td></tr>`).join('')
            : `<tr><td colspan="3" style="text-align:center;padding:22px;color:var(--gri)">Veri yok</td></tr>`}
          </tbody></table></div></div>

      <div class="bolum"><h3>${ik('layers')} Kategori Kırılımı</h3>
        <div class="tablo-sar"><table>
          <thead><tr><th>Kategori</th><th class="orta">Adet</th><th class="sag">Tutar</th></tr></thead>
          <tbody>${r.kategoriler.length ? r.kategoriler.map(k => `<tr>
            <td>${kacis(k.ad)}</td><td class="orta">${k.adet}</td>
            <td class="sag para">${tl(k.tutar)}</td></tr>`).join('')
            : `<tr><td colspan="3" style="text-align:center;padding:22px;color:var(--gri)">Veri yok</td></tr>`}
          </tbody></table></div></div>

      <div class="bolum"><h3>${ik('calendar')} Günlük Ciro</h3>
        <div class="tablo-sar"><table>
          <thead><tr><th>Gün</th><th class="orta">Adisyon</th><th class="sag">Tahsilat</th></tr></thead>
          <tbody>${r.gunler.length ? r.gunler.map(g => `<tr>
            <td>${tarihFmt(g.gun)}</td><td class="orta">${g.adisyon}</td>
            <td class="sag para">${tl(g.tutar)}</td></tr>`).join('')
            : `<tr><td colspan="3" style="text-align:center;padding:22px;color:var(--gri)">Veri yok</td></tr>`}
          </tbody></table></div></div>
    </div>

    <div class="bolum"><h3>${ik('lock')} Gün Sonu (Z Raporu)</h3>
      <div style="background:#fff;border:1px solid var(--cizgi);border-radius:12px;padding:16px">
        ${gs.adisyon_sayisi ? `
          <div style="font-size:13px;color:var(--gri);margin-bottom:12px">
            Henüz gün sonuna girmemiş <b style="color:#0F172A">${gs.adisyon_sayisi}</b> kapalı adisyon var.</div>
          <div class="kart-sira" style="margin-bottom:12px">
            <div class="ozet-kart"><div class="etiket">Net</div><div class="deger" style="font-size:19px">${tl(gs.net_kurus)}</div></div>
            <div class="ozet-kart"><div class="etiket">${ik('banknote')} Nakit</div><div class="deger" style="font-size:19px">${tl(gs.nakit_kurus)}</div></div>
            <div class="ozet-kart"><div class="etiket">${ik('credit-card')} Kart</div><div class="deger" style="font-size:19px">${tl(gs.kart_kurus)}</div></div>
            <div class="ozet-kart"><div class="etiket">${ik('ticket')} Çek</div><div class="deger" style="font-size:19px">${tl(gs.ceki_kurus)}</div></div>
          </div>
          ${gs.acik_adisyonlar.length ? `<div class="hata" style="display:block">
            ${ik('triangle-alert')} <b>${gs.acik_adisyonlar.length}</b> açık adisyon var
            (${gs.acik_adisyonlar.map(a => '#' + kacis(a.kod) + ' ' + kacis(a.masa_ad || '')).join(', ')}).
            Gün sonu alırsanız bunlar yarına devreder.</div>` : ''}
          ${yoneticiMi() ? `<button class="btn btn-koyu" onclick="gunSonuAl(${gs.acik_adisyonlar.length})">
            ${ik('lock')} Gün Sonunu Al</button>` : `<div style="font-size:12px;color:var(--gri)">
            Gün sonu almak için yönetici yetkisi gerekli.</div>`}
        ` : `<div style="font-size:13px;color:var(--gri)">
          Gün sonuna girecek kapanmış adisyon yok.
          ${gs.son_gun_sonu ? `Son gün sonu: <b>${tarihFmt(gs.son_gun_sonu.tarih)}
          ${saatFmt(gs.son_gun_sonu.kapanis)}</b> · ${tl(gs.son_gun_sonu.net_kurus)}` : ''}</div>`}
        <div style="margin-top:13px"><button class="btn btn-cizgi btn-kucuk" onclick="gunSonuListe()">
          ${ik('scroll-text')} Geçmiş Gün Sonları</button></div>
      </div></div>`;
}

function raporHizli(gun) {
  const bit = new Date(), bas = new Date(Date.now() - (gun - 1) * 86400000);
  raporCiz(bas.toISOString().slice(0, 10), bit.toISOString().slice(0, 10));
}

function gunSonuAl(acikSayi) {
  onay('Gün Sonu Al',
    `Kapanmış tüm adisyonlar tek bir gün sonu kaydına mühürlenecek ve bir daha ciroya girmeyecek.
     ${acikSayi ? `<br><br><b style="color:var(--kirmizi)">${acikSayi} açık adisyon</b> var;
     bunlar kapanınca bir SONRAKİ gün sonuna yazılacak.` : ''}
     <br><br>Devam edilsin mi?`,
    `gunSonuOnay(${acikSayi ? 1 : 0})`, false);
}

async function gunSonuOnay(zorla) {
  try {
    const g = await POST('/rapor/gun-sonu', { zorla });
    modalKapat(); iyi(`Gün sonu alındı · ${tl(g.net_kurus)}`);
    gunSonuDetay(g.id);
  } catch (e) { modalKapat(); kotu(e.message); }
}

async function gunSonuListe() {
  try {
    const liste = await GET('/rapor/gun-sonu/liste');
    modalAc('Geçmiş Gün Sonları', liste.length ? `
      <div class="tablo-sar"><table>
        <thead><tr><th>Tarih</th><th class="orta">Adisyon</th><th class="sag">Net</th><th></th></tr></thead>
        <tbody>${liste.map(g => `<tr>
          <td>${tarihFmt(g.tarih)}<br><small style="color:var(--gri)">${saatFmt(g.kapanis)} · ${kacis(g.kapatan_ad || '')}</small></td>
          <td class="orta">${g.adisyon_sayisi}</td>
          <td class="sag para">${tl(g.net_kurus)}</td>
          <td><button class="btn btn-cizgi btn-kucuk" onclick="gunSonuDetay(${g.id})">Aç</button></td>
        </tr>`).join('')}</tbody></table></div>`
      : '<p style="color:var(--gri)">Henüz gün sonu alınmamış.</p>',
      `<button class="btn btn-gri" onclick="modalKapat()">Kapat</button>`, true);
  } catch (e) { kotu(e.message); }
}

async function gunSonuDetay(gid) {
  try {
    const g = await GET('/rapor/gun-sonu/' + gid);
    modalAc(`Gün Sonu — ${tarihFmt(g.tarih)}`, `
      <div class="odeme-ozet">
        <div class="kalan-et">Net Ciro</div><div class="kalan">${tl(g.net_kurus)}</div>
        <div class="detay">${g.adisyon_sayisi} adisyon · ${saatFmt(g.kapanis)} ·
          ${kacis(g.kapatan_ad || '')}</div></div>
      <div class="tablo-sar" style="margin-bottom:14px"><table><tbody>
        <tr><td>Brüt Satış</td><td class="sag para">${tl(g.brut_kurus)}</td></tr>
        <tr><td>İskonto</td><td class="sag para" style="color:var(--sari)">−${tl(g.iskonto_kurus)}</td></tr>
        <tr><td>İkram</td><td class="sag para" style="color:var(--sari)">${tl(g.ikram_kurus)}</td></tr>
        <tr><td><b>Net</b></td><td class="sag para"><b>${tl(g.net_kurus)}</b></td></tr>
        <tr><td>${ik('banknote')} Nakit</td><td class="sag para">${tl(g.nakit_kurus)}</td></tr>
        <tr><td>${ik('credit-card')} Kart</td><td class="sag para">${tl(g.kart_kurus)}</td></tr>
        <tr><td>${ik('ticket')} Yemek Çeki</td><td class="sag para">${tl(g.ceki_kurus)}</td></tr>
        <tr><td>${ik('notebook-pen')} Açık Hesap</td><td class="sag para">${tl(g.acik_kurus)}</td></tr>
      </tbody></table></div>
      <h3 style="font-size:13px;margin-bottom:8px">En Çok Satanlar</h3>
      <div class="tablo-sar"><table><tbody>
        ${g.urunler.map(u => `<tr><td>${kacis(u.ad)}</td><td class="orta">${u.adet}</td>
          <td class="sag para">${tl(u.tutar)}</td></tr>`).join('')}
      </tbody></table></div>`,
      `<button class="btn btn-gri" onclick="modalKapat()">Kapat</button>
       <button class="btn btn-cizgi" onclick="window.print()">${ik('printer')} Yazdır</button>`, true);
  } catch (e) { kotu(e.message); }
}
</script>

<script>
/* ════════════════ MENÜ YÖNETİMİ ════════════════ */

let _tamMenu = [];                       // pasifler dahil tam menü (düzenleme formları için)

function kategoriDuzenle(kid) {
  const k = kid ? _katBul(kid) : { ad: '', renk: '#F97316', sira: 0, aktif: 1 };
  modalAc(kid ? 'Kategori Düzenle' : 'Yeni Kategori', `
    <div class="alan"><label>Kategori Adı</label><input id="kAd" value="${kacis(k.ad)}"></div>

async function topluMasaOnay() {
  const salon = parseInt(document.getElementById('tmSalon').value);
  const on = document.getElementById('tmOn').value.trim();
  const bas = parseInt(document.getElementById('tmBas').value) || 1;
  const bit = parseInt(document.getElementById('tmBit').value) || 1;
  const kap = parseInt(document.getElementById('tmKap').value) || 4;
  if (bit < bas) return kotu('Bitiş numarası başlangıçtan küçük olamaz');
  if (bit - bas > 199) return kotu('Tek seferde en fazla 200 masa eklenebilir');
  try {
    for (let i = bas; i <= bit; i++)
      await POST('/masa/masa', { salon_id: salon, ad: on + i, kapasite: kap, sira: i, aktif: 1 });
    modalKapat(); iyi(`${bit - bas + 1} masa eklendi`); yMasa();
  } catch (e) { kotu(e.message); }
}

<script>

function kategoriIkonSec(ad) {

/**
 * Seçilen dosyayı tarayıcıda küçültüp data URI döndürür.
 * Sunucuya ham fotoğraf GİTMEZ: 4 MB'lık telefon fotoğrafı ~30 KB'a iner.
 * @param enBoy  uzun kenar piksel sınırı
 * @param kalite JPEG kalitesi (0-1)
 * @param tip    'image/jpeg' (fotoğraf) ya da 'image/png' (şeffaf logo)
 */
function gorselKucult(dosya, enBoy, kalite, tip = 'image/jpeg') {
  return new Promise((coz, hata) => {
    if (!dosya.type.startsWith('image/')) return hata(new Error('Bu bir görsel dosyası değil'));
    const okuyucu = new FileReader();
    okuyucu.onerror = () => hata(new Error('Dosya okunamadı'));
    okuyucu.onload = () => {
      const im = new Image();
      im.onerror = () => hata(new Error('Görsel açılamadı (bozuk dosya olabilir)'));
      im.onload = () => {
        const oran = Math.min(1, enBoy / Math.max(im.width, im.height));
        const g = Math.max(1, Math.round(im.width * oran));
        const y = Math.max(1, Math.round(im.height * oran));
        const tuval = document.createElement('canvas');
        tuval.width = g; tuval.height = y;
        const ct = tuval.getContext('2d');
        if (tip === 'image/jpeg') { ct.fillStyle = '#fff'; ct.fillRect(0, 0, g, y); }
        ct.drawImage(im, 0, 0, g, y);
        coz(tuval.toDataURL(tip, kalite));
      };
      im.src = okuyucu.result;
    };
    okuyucu.readAsDataURL(dosya);
  });
}

async function urunGorselSec(girdi) {
  const d = girdi.files && girdi.files[0];
  if (!d) return;
  try {
    const uri = await gorselKucult(d, 500, 0.72, 'image/jpeg');
    S.gorselTaslak = uri;
    document.getElementById('uGorselOnizleme').innerHTML = `<img src="${uri}" alt="">`;
    document.getElementById('uGorselSil').style.display = '';
  } catch (e) { kotu(e.message); }
  girdi.value = '';
}

}

async function yQr() {
  let salonlar, agBilgi;

    S.ayar = await GET('/ayar');
    salonlar = await GET('/masa/salonlar');
    agBilgi = await GET('/ayar/ag');
  } catch (e) { return kotu(e.message); }

  window._agBilgi = agBilgi;

  // adresini kullan — location.origin localhost olabilir ve telefonda açılmaz.
  const taban = S.ayar.qr_taban_url || agBilgi.onerilen || location.origin;
  const yerelMi = a => /^https?:\/\/(localhost|127\.0\.0\.1|\[::1\])(:|\/|$)/i.test(a);

      <div style="background:#FEF2F2;border:1.5px solid #FCA5A5;border-radius:12px;
        padding:16px;margin-bottom:16px">
        <div style="display:flex;gap:10px;align-items:flex-start">

          <div>
            <b style="color:#B91C1C">Bu karekodlar telefonda ÇALIŞMAZ</b>
            <div style="font-size:12.5px;color:#7F1D1D;margin-top:5px;line-height:1.65">
              Adres <code>${kacis(taban)}</code> — <code>localhost</code> her cihazın
              "kendisi" demektir; müşterinin telefonu bu adreste kendi telefonunu arar.
              Aşağıdan bu bilgisayarın yerel ağ adresini seçin.</div>
          </div>
        </div>

        padding:13px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center">

          Karekodlar <b>${kacis(taban)}</b> adresini gösteriyor${ayarsiz
            ? ' <span style="opacity:.75">(sunucunun bulduğu adres — kalıcı olması için kaydedin)</span>'
            : ''}.
        </div>
      </div>`}

    <div style="background:#fff;border:1px solid var(--cizgi);border-radius:12px;
      padding:16px;margin-bottom:18px">
      <div class="alan" style="margin-bottom:12px">
        <label>QR Adresi <span style="font-weight:400;text-transform:none">

        <div style="display:flex;gap:8px;flex-wrap:wrap">

        letter-spacing:.05em;margin-bottom:7px">Bu bilgisayarın ağ adresleri</div>
      ${agBilgi.adaylar.length ? `<div class="hizli-sira" style="margin-bottom:10px">
        ${agBilgi.adaylar.map(a => `<button class="hizli"
          style="${a === taban ? 'border-color:var(--ana);background:var(--ana-acik);color:var(--ana-koyu)' : ''}"
          onclick="qrTabanSec('${a}')">${ik('check')} ${kacis(a)}</button>`).join('')}
      </div>` : `<div style="font-size:12.5px;color:var(--kirmizi);margin-bottom:10px">
        Yerel ağ adresi bulunamadı — bilgisayar bir ağa bağlı değil gibi görünüyor.</div>`}

      </div>
    </div>

    <div style="background:#fff;border:1px solid var(--cizgi);border-radius:12px;
      padding:16px;margin-bottom:18px">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px">
        ${ik('triangle-alert')}<b style="font-size:14px">Telefonda açılmıyorsa</b>
      </div>
      <div style="font-size:12.5px;line-height:1.9;color:#334155">
        <b>1 · Windows Güvenlik Duvarı</b> — en sık sebep budur. Kasadaki bilgisayarda

        birbirini görmesini engeller. Telefonu ana Wi-Fi ağına alın.<br>
        <b>4 · Adresi telefonda elle deneyin</b> — telefonun tarayıcısına
        <code>${kacis(taban)}/menu</code> yazın. Açılıyorsa sorun karekodda değil,
        karekod okuyucudadır (bazı kameralar http adreslerini açmaz; Chrome ya da

    ${salonlar.filter(s => s.masalar.length).map(s => `
      <div class="bolum"><h3>${ik('armchair')} ${kacis(s.ad)}
        <small>${s.masalar.length} masa</small></h3>
        <div class="qr-izgara" id="qrSalon${s.id}"></div></div>`).join('')}`;

  qrBas('qrGenel', [{ ad: S.ayar.isletme_adi || 'Menü', alt: 'Genel karekod',
                      url: `${taban}/menu` }]);

    if (!s.masalar.length) continue;
    qrBas(`qrSalon${s.id}`, s.masalar.filter(m => m.aktif).map(m => ({
      ad: m.ad, alt: `${s.ad} — ${m.ad}`, url: `${taban}/menu?masa=${m.id}` })));
  }
}

function qrTabanSec(adres) {
  document.getElementById('qrTaban').value = adres;
  qrTabanKaydet();
}

function komutKopyala() {
  const metin = document.getElementById('fwKomut').textContent;
  navigator.clipboard?.writeText(metin)
    .then(() => iyi('Komut panoya kopyalandı'))
    .catch(() => kotu('Kopyalanamadı — komutu elle seçip kopyalayın'));
}

/** Kartları önce iskeletle basar, QR'ları sunucudan tek tek çeker (SVG). */
async function qrBas(hedefId, liste) {
  const kutu = document.getElementById(hedefId);
  if (!kutu) return;
  kutu.innerHTML = liste.map((x, i) => `<div class="qr-kart">
    <div class="qr-ad">${kacis(x.ad)}</div>
    <div id="${hedefId}_${i}" style="min-height:150px;display:flex;align-items:center;
      justify-content:center;color:var(--gri);font-size:12px">…</div>
    <div class="qr-alt">${kacis(x.alt)}<br>${kacis(x.url)}</div>
  </div>`).join('');
  for (let i = 0; i < liste.length; i++) {
    try {
      const svg = await fetch(API + '/acik/qr?veri=' + encodeURIComponent(liste[i].url))
        .then(r => r.ok ? r.text() : Promise.reject(new Error('QR üretilemedi')));
      document.getElementById(`${hedefId}_${i}`).innerHTML = svg;
    } catch (e) {
      document.getElementById(`${hedefId}_${i}`).textContent = 'QR üretilemedi';
    }
  }
}

async function qrTabanKaydet() {
  try {
    S.ayar = await PATCH('/ayar', { qr_taban_url: document.getElementById('qrTaban').value });
    iyi('QR adresi kaydedildi'); yQr();
  } catch (e) { kotu(e.message); }
}

function qrYazdir() {
  // Yazdırırken sadece QR kartları kalsın diye sayfayı geçici olarak sadeleştir.
  const eski = document.getElementById('fisAlani').innerHTML;
  document.getElementById('fisAlani').innerHTML =
    `<div style="font-family:sans-serif">${document.getElementById('yonetimGovde').innerHTML}</div>`;
  const stil = document.createElement('style');
  stil.id = 'qrYazdirStil';
  stil.textContent = `@media print{ #fisAlani{width:auto!important;font-family:sans-serif!important}
    #fisAlani .qr-izgara{display:grid;grid-template-columns:repeat(3,1fr);gap:10mm}
    #fisAlani .qr-kart{border:1px solid #999;padding:6mm;text-align:center}
    #fisAlani .alan,#fisAlani button,#fisAlani input{display:none!important} }`;
  document.head.appendChild(stil);
  window.print();
  setTimeout(() => {
    document.getElementById('fisAlani').innerHTML = eski;
    document.getElementById('qrYazdirStil')?.remove();
  }, 700);
}
</script>
