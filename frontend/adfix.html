<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Adfix — Adisyon Sistemi</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F97316">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F97316'/%3E%3Ctext y='72' x='50' font-size='58' text-anchor='middle'%3E%F0%9F%A7%A8%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ana:#F97316; --ana-koyu:#C2410C; --ana-acik:#FFF7ED;
  --koyu:#1E293B; --koyu2:#0F172A; --gri:#64748B; --cizgi:#E2E8F0;
  --zemin:#F1F5F9; --kart:#FFFFFF;
  --yesil:#16A34A; --kirmizi:#DC2626; --mavi:#2563EB; --mor:#7C3AED; --sari:#CA8A04;
}
/* Lucide ikonları — currentColor ile metnin rengini alır, her boyutta net */
.ik{width:1.08em;height:1.08em;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-.16em}
.ik-b{width:1.35em;height:1.35em}
.ik-xl{width:2.2em;height:2.2em;stroke-width:1.6}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;background:var(--zemin);color:#0F172A;overflow:hidden}
input,select,textarea,button{font-family:inherit;font-size:14px}
.gizli{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#94A3B8}

/* ───────────── giriş ───────────── */
#girisEkran{display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:linear-gradient(135deg,#7C2D12 0%,#C2410C 45%,#EA580C 100%)}
.giris-kutu{background:#fff;border-radius:18px;padding:34px;width:360px;max-width:92vw;
  box-shadow:0 24px 60px rgba(0,0,0,.35)}
.marka{text-align:center;margin-bottom:26px}
.marka-ikon{width:64px;height:64px;margin:0 auto 12px;border-radius:18px;
  background:linear-gradient(140deg,#F97316,#DC2626);display:flex;align-items:center;
  justify-content:center;font-size:32px;box-shadow:0 10px 26px rgba(249,115,22,.45)}
.marka h1{font-size:27px;font-weight:800;letter-spacing:-.6px}
.marka p{font-size:11px;color:var(--gri);letter-spacing:3px;margin-top:3px;text-transform:uppercase}
.alan{margin-bottom:14px}
.alan label{display:block;font-size:11px;font-weight:700;color:var(--gri);
  margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.alan input,.alan select,.alan textarea{width:100%;padding:11px 13px;border:1.5px solid var(--cizgi);
  border-radius:10px;background:#fff;transition:border .15s,box-shadow .15s}
.alan input:focus,.alan select:focus,.alan textarea:focus{outline:none;border-color:var(--ana);
  box-shadow:0 0 0 3px rgba(249,115,22,.15)}
.btn{padding:11px 18px;border:none;border-radius:10px;font-weight:600;cursor:pointer;
  transition:transform .08s,filter .15s;background:var(--ana);color:#fff}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-tam{width:100%;padding:13px;font-size:15px}
.btn-gri{background:#E2E8F0;color:#334155}
.btn-yesil{background:var(--yesil)}
.btn-kirmizi{background:var(--kirmizi)}
.btn-mavi{background:var(--mavi)}
.btn-koyu{background:var(--koyu)}
.btn-cizgi{background:#fff;color:#334155;border:1.5px solid var(--cizgi)}
.btn-kucuk{padding:7px 11px;font-size:12.5px;border-radius:8px}
.hata{background:#FEF2F2;color:#B91C1C;padding:9px 13px;border-radius:9px;
  font-size:12.5px;margin-bottom:12px;display:none;border:1px solid #FECACA}
.demo-not{margin-top:16px;font-size:11.5px;color:var(--gri);text-align:center;line-height:1.7}
.demo-not code{background:var(--zemin);padding:1px 6px;border-radius:4px;font-size:11px}

/* ───────────── iskelet ───────────── */
#uygulama{display:none;height:100vh}
.yan{width:196px;background:var(--koyu2);display:flex;flex-direction:column;flex-shrink:0;
  transition:transform .25s}
.yan-ust{padding:16px 15px;border-bottom:1px solid rgba(255,255,255,.08)}
.yan-marka{display:flex;align-items:center;gap:9px}
.yan-marka-ikon{width:32px;height:32px;border-radius:9px;
  background:linear-gradient(140deg,#F97316,#DC2626);display:flex;align-items:center;
  justify-content:center;font-size:17px}
.yan-marka b{color:#fff;font-size:17px;font-weight:800;letter-spacing:-.3px}
.yan-kul{font-size:11px;color:#94A3B8;margin-top:9px;line-height:1.5}
.yan-kul b{color:#F97316;display:block;font-size:12px}
.menu{flex:1;padding:8px 0;overflow-y:auto}
.menu-og{display:flex;align-items:center;gap:10px;padding:11px 15px;cursor:pointer;
  color:#CBD5E1;font-size:13.5px;border-left:3px solid transparent;transition:all .13s}
.menu-og:hover{background:rgba(255,255,255,.05);color:#fff}
.menu-og.aktif{background:rgba(249,115,22,.14);color:#FB923C;border-left-color:var(--ana);font-weight:600}
.menu-og .ik{width:18px;height:18px}
.menu-rozet{margin-left:auto;background:var(--kirmizi);color:#fff;font-size:10px;
  font-weight:700;padding:1px 6px;border-radius:9px;min-width:18px;text-align:center}
.yan-alt{padding:11px 15px;border-top:1px solid rgba(255,255,255,.08)}
.yan-cikis{font-size:12px;color:#94A3B8;cursor:pointer}
.yan-cikis:hover{color:#F87171}
.govde{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ust{background:#fff;border-bottom:1px solid var(--cizgi);padding:11px 18px;
  display:flex;align-items:center;gap:14px;flex-shrink:0;min-height:56px}
.ust h2{font-size:17px;font-weight:700}
.ust-bilgi{font-size:12px;color:var(--gri)}
.ust-sag{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sayfa{flex:1;overflow-y:auto;padding:18px}
.menu-ac{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:#334155}

/* ───────────── masa planı ───────────── */
.salon-sekme{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.sekme{padding:8px 15px;border-radius:20px;background:#fff;border:1.5px solid var(--cizgi);
  cursor:pointer;font-size:13px;font-weight:600;color:#475569;transition:all .15s;
  display:inline-flex;align-items:center;gap:7px}
.sekme:hover{border-color:#CBD5E1}
.sekme.aktif{background:var(--ana);border-color:var(--ana);color:#fff}
.masa-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:13px}
.masa{background:#fff;border:2px solid var(--cizgi);border-radius:14px;padding:13px;
  cursor:pointer;transition:all .15s;min-height:112px;display:flex;flex-direction:column;
  position:relative;overflow:hidden}
.masa:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.09)}
.masa.dolu{border-color:var(--ana);background:linear-gradient(160deg,#FFF7ED,#FFEDD5)}
.masa.odendi{border-color:var(--yesil);background:linear-gradient(160deg,#F0FDF4,#DCFCE7)}
.masa-ad{font-size:19px;font-weight:800;letter-spacing:-.4px}
.masa-bos{font-size:12px;color:#94A3B8;margin-top:auto}
.masa-tutar{font-size:18px;font-weight:800;color:var(--ana-koyu);margin-top:auto}
.masa-satir{display:flex;justify-content:space-between;align-items:center;
  font-size:11.5px;color:var(--gri);margin-top:3px}
.masa-rozet{position:absolute;top:9px;right:9px;background:var(--kirmizi);color:#fff;
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:9px}
.masa-kap{font-size:11px;color:#94A3B8}
.bos-durum{text-align:center;padding:56px 20px;color:var(--gri)}
.bos-durum .ikon{font-size:46px;margin-bottom:12px;opacity:.55}

/* ───────────── özet kartları ───────────── */
.kart-sira{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.ozet-kart{background:#fff;border:1px solid var(--cizgi);border-radius:12px;padding:14px 16px}
.ozet-kart .etiket{font-size:11px;color:var(--gri);text-transform:uppercase;
  letter-spacing:.05em;font-weight:700}
.ozet-kart .deger{font-size:23px;font-weight:800;margin-top:5px;letter-spacing:-.6px}
.ozet-kart .alt{font-size:11.5px;color:var(--gri);margin-top:2px}
.ozet-kart.vurgu{background:linear-gradient(140deg,#F97316,#DC2626);border:none;color:#fff}
.ozet-kart.vurgu .etiket,.ozet-kart.vurgu .alt{color:rgba(255,255,255,.8)}

/* ───────────── adisyon ekranı ───────────── */
.adisyon-duzen{display:grid;grid-template-columns:1fr 372px;gap:14px;height:100%}
.urun-panel{display:flex;flex-direction:column;overflow:hidden}
.kat-sekme{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;flex-shrink:0}
.kat-sekme .sekme{white-space:nowrap;padding:7px 13px;font-size:12.5px;
  display:inline-flex;align-items:center;gap:6px}
.urun-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));
  gap:9px;overflow-y:auto;align-content:start;padding-right:4px}
.urun{background:#fff;border:1.5px solid var(--cizgi);border-radius:11px;padding:11px 10px;
  cursor:pointer;text-align:left;transition:all .12s;min-height:74px;display:flex;
  flex-direction:column;justify-content:space-between}
.urun:hover{border-color:var(--ana);background:var(--ana-acik);transform:translateY(-1px)}
.urun:active{transform:scale(.96)}
.urun .ad{font-size:12.5px;font-weight:600;line-height:1.35}
.urun .fy{font-size:14px;font-weight:800;color:var(--ana-koyu);margin-top:6px}
.urun-gorsel{width:100%;height:66px;border-radius:8px;overflow:hidden;margin-bottom:7px;
  display:flex;align-items:center;justify-content:center;background:var(--zemin)}
.urun-gorsel img{width:100%;height:100%;object-fit:cover;display:block}
.urun-gorsel .ik{width:26px;height:26px;opacity:.85;stroke-width:1.6}
.gorsel-kutu{display:flex;align-items:center;gap:13px;padding:12px;border:1.5px dashed var(--cizgi);
  border-radius:11px;background:#FAFAFA}
.gorsel-onizleme{width:74px;height:74px;border-radius:10px;overflow:hidden;flex-shrink:0;
  background:var(--zemin);display:flex;align-items:center;justify-content:center;color:var(--gri)}
.gorsel-onizleme img{width:100%;height:100%;object-fit:cover}
.logo-onizleme{width:96px;height:96px;border-radius:14px;background:var(--zemin);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
  border:1px solid var(--cizgi)}
.logo-onizleme img{max-width:100%;max-height:100%;object-fit:contain}
.marka-ikon img,.yan-marka-ikon img{width:100%;height:100%;object-fit:contain;
  border-radius:inherit;background:#fff}
.qr-kart{background:#fff;border:1px solid var(--cizgi);border-radius:12px;padding:14px;
  text-align:center;break-inside:avoid}
.qr-kart svg{width:100%;height:auto;max-width:190px;margin:0 auto;display:block}
.qr-kart .qr-ad{font-size:16px;font-weight:800;margin-bottom:8px}
.qr-kart .qr-alt{font-size:11px;color:var(--gri);margin-top:8px;word-break:break-all}
.qr-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:13px}
.sepet-panel{background:#fff;border:1px solid var(--cizgi);border-radius:14px;
  display:flex;flex-direction:column;overflow:hidden}
.sepet-ust{padding:13px 15px;border-bottom:1px solid var(--cizgi);background:#FAFAFA}
.sepet-ust h3{font-size:16px;font-weight:800}
.sepet-ust .alt{font-size:11.5px;color:var(--gri);margin-top:2px}
.sepet-liste{flex:1;overflow-y:auto;padding:6px 0}
.sepet-satir{display:flex;align-items:center;gap:9px;padding:8px 14px;border-bottom:1px solid #F1F5F9}
.sepet-satir.ikram{background:#F0FDF4}
.sepet-satir.iptal{background:#FEF2F2;opacity:.62;text-decoration:line-through}
.sepet-satir.yeni{background:#FFFBEB}
.sepet-satir .bilgi{flex:1;min-width:0}
.sepet-satir .ad{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.sepet-satir .kck{font-size:11px;color:var(--gri);margin-top:1px}
.sepet-satir .tut{font-size:13.5px;font-weight:700;min-width:76px;text-align:right}
.adet-kutu{display:flex;align-items:center;gap:2px;background:var(--zemin);border-radius:8px;padding:2px}
.adet-kutu button{width:26px;height:26px;border:none;background:#fff;border-radius:6px;
  cursor:pointer;color:#475569;line-height:0;display:inline-flex;
  align-items:center;justify-content:center}
.adet-kutu button:hover{background:var(--ana);color:#fff}
.adet-kutu span{min-width:24px;text-align:center;font-weight:700;font-size:13px}
.satir-menu{background:none;border:none;cursor:pointer;color:#94A3B8;font-size:17px;
  padding:2px 4px;line-height:0}
.satir-menu:hover{color:var(--kirmizi)}
.sepet-alt{border-top:2px solid var(--cizgi);padding:13px 15px;background:#FAFAFA}
.top-satir{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:#475569}
.top-satir.buyuk{font-size:20px;font-weight:800;color:#0F172A;padding-top:8px;
  border-top:1px dashed var(--cizgi);margin-top:8px}
.top-satir.yesil{color:var(--yesil);font-weight:700}
.top-satir.kirmizi{color:var(--kirmizi);font-weight:700}
.islem-sira{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.islem-sira .genis{grid-column:1/-1}

/* ───────────── mutfak ───────────── */
.mutfak-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}
.fis-kart{background:#fff;border-left:5px solid var(--mavi);border-radius:11px;padding:13px;
  box-shadow:0 2px 6px rgba(0,0,0,.05)}
.fis-kart.uyari{border-left-color:var(--sari);background:#FEFCE8}
.fis-kart.gecikti{border-left-color:var(--kirmizi);background:#FEF2F2;animation:nabiz 1.8s infinite}
@keyframes nabiz{50%{box-shadow:0 0 0 5px rgba(220,38,38,.12)}}
.fis-ust{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.fis-masa{font-size:16px;font-weight:800}
.fis-sure{font-size:12px;font-weight:700;padding:2px 8px;border-radius:9px;
  background:var(--zemin);color:#475569}
.fis-sure.gec{background:#FEE2E2;color:#B91C1C}
.fis-urun{font-size:14px;font-weight:600;padding:4px 0}
.fis-urun .adet{display:inline-block;background:var(--koyu);color:#fff;font-size:11.5px;
  padding:1px 7px;border-radius:6px;margin-right:6px;font-weight:700}
.fis-not{font-size:11.5px;color:var(--ana-koyu);font-style:italic;margin-top:2px}
.fis-alt{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
  padding-top:9px;border-top:1px dashed var(--cizgi)}
.fis-garson{font-size:11px;color:var(--gri)}

/* ───────────── tablo ───────────── */
.tablo-sar{background:#fff;border:1px solid var(--cizgi);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#F8FAFC;padding:10px 12px;text-align:left;font-size:11px;font-weight:700;
  color:var(--gri);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--cizgi);
  white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:9px 12px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
tbody tr:hover{background:#FAFAFA}
.sag{text-align:right}
.orta{text-align:center}
.para{font-variant-numeric:tabular-nums;font-weight:600}
.etiket-durum{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;
  border-radius:9px;text-transform:uppercase;letter-spacing:.03em}
.d-acik{background:#FFEDD5;color:#9A3412}
.d-kapali{background:#DCFCE7;color:#15803D}
.d-iptal{background:#FEE2E2;color:#B91C1C}
.d-pasif{background:#F1F5F9;color:#64748B}
.bolum{margin-bottom:22px}
.bolum h3{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;
  align-items:center;gap:8px}
.bolum h3 small{font-weight:500;color:var(--gri);font-size:12px}

/* ───────────── modal ───────────── */
.perde{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:200;
  align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.perde.acik{display:flex}
.modal{background:#fff;border-radius:16px;width:440px;max-width:96vw;max-height:92vh;
  overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal.genis{width:680px}
.modal-ust{padding:16px 20px;border-bottom:1px solid var(--cizgi);display:flex;
  align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:3}
.modal-ust h3{font-size:16px;font-weight:700}
.modal-kapat{background:none;border:none;cursor:pointer;color:#94A3B8;line-height:0;padding:4px}
.modal-kapat:hover{color:#334155}
.modal-govde{padding:20px 20px 26px}
.modal-alt{padding:14px 20px;border-top:1px solid var(--cizgi);display:flex;gap:9px;
  justify-content:flex-end;background:#FAFAFA;position:sticky;bottom:0}

/* ───────────── ödeme ───────────── */
.odeme-ozet{background:var(--koyu2);color:#fff;border-radius:13px;padding:17px;margin-bottom:16px}
.odeme-ozet .kalan-et{font-size:11.5px;color:#94A3B8;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.odeme-ozet .kalan{font-size:35px;font-weight:800;letter-spacing:-1.2px;margin-top:3px}
.odeme-ozet .detay{font-size:11.5px;color:#94A3B8;margin-top:6px}
.tur-sec{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.tur{padding:13px 9px;border:2px solid var(--cizgi);border-radius:11px;background:#fff;
  cursor:pointer;text-align:center;font-weight:600;font-size:13px;transition:all .13s}
.tur:hover{border-color:#CBD5E1}
.tur.aktif{border-color:var(--ana);background:var(--ana-acik);color:var(--ana-koyu)}
.tur-ik{display:block;margin-bottom:5px;color:var(--gri)}
.tur.aktif .tur-ik{color:var(--ana)}
.tus-takim{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.tus{padding:15px;border:1.5px solid var(--cizgi);border-radius:11px;background:#fff;
  font-size:19px;font-weight:700;cursor:pointer;transition:all .1s}
.tus:hover{background:var(--zemin)}
.tus:active{background:var(--ana);color:#fff;transform:scale(.95)}
.tus.islem{background:#F8FAFC;font-size:15px;color:#475569}
.tutar-goster{font-size:31px;font-weight:800;text-align:right;padding:13px 15px;
  background:var(--zemin);border-radius:11px;font-variant-numeric:tabular-nums;
  border:2px solid var(--cizgi)}
.hizli-sira{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.hizli{padding:7px 12px;border:1.5px solid var(--cizgi);border-radius:8px;background:#fff;
  font-size:12.5px;font-weight:600;cursor:pointer}
.hizli:hover{border-color:var(--ana);color:var(--ana-koyu)}
.ustu-kutu{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:10px;padding:11px 14px;
  margin-top:11px;display:flex;justify-content:space-between;align-items:center}
.ustu-kutu b{font-size:19px;color:var(--yesil)}

/* ───────────── bildirim ───────────── */
#bildirimler{position:fixed;bottom:16px;right:16px;z-index:400;display:flex;
  flex-direction:column;gap:8px;max-width:340px}
.bildirim{background:var(--koyu2);color:#fff;padding:12px 16px;border-radius:11px;
  font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.28);animation:gir .22s ease;
  border-left:4px solid var(--ana)}
.bildirim.iyi{border-left-color:var(--yesil)}
.bildirim.kotu{border-left-color:var(--kirmizi)}
@keyframes gir{from{opacity:0;transform:translateY(16px)}}

/* ───────────── fiş çıktısı ───────────── */
#fisAlani{display:none}
@media print{
  body{background:#fff;overflow:visible}
  body>*{display:none!important}
  #fisAlani{display:block!important;width:76mm;margin:0 auto;font-family:'Courier New',monospace;
    font-size:12px;color:#000}
  .fis-baslik{text-align:center;font-weight:bold;font-size:16px;margin-bottom:2mm}
  .fis-ayrac{border-top:1px dashed #000;margin:2mm 0}
  .fis-sat{display:flex;justify-content:space-between;gap:4mm}
  .fis-buyuk{font-size:15px;font-weight:bold}
  .fis-kucuk{font-size:10px}
  .fis-orta{text-align:center}
  .fis-logo{max-height:16mm;max-width:44mm;object-fit:contain;margin-bottom:1.5mm}
}

/* ───────────── duyarlı ───────────── */
@media(max-width:1080px){ .adisyon-duzen{grid-template-columns:1fr 320px} }
@media(max-width:860px){
  .menu-ac{display:block}
  .yan{position:fixed;left:0;top:0;bottom:0;z-index:120;transform:translateX(-100%)}
  .yan.acik{transform:translateX(0)}
  .yan-perde{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:110}
  .yan-perde.acik{display:block}
  .adisyon-duzen{grid-template-columns:1fr;height:auto}
  .sepet-panel{max-height:none}
  .sayfa{padding:12px}
  .masa-izgara{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
}
</style>

0 0 0-2 2v8" /> <path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1" /> <path d="M2 21h20" /> <path d="M7 8v3" /> <path d="M12 8v3" /> <path d="M17 8v3" /> <path d="M7 4h.01" /> <path d="M12 4h.01" /> <path d="M17 4h.01" /></symbol><symbol id="i-dessert" viewBox="0 0 24 24"><path d="M10.162 3.167A10 10 0 0 0 2 13a2 2 0 0 0 4 0v-1a2 2 0 0 1 4 0v4a2 2 0 0 0 4 0v-4a2 2 0 0 1 4 0v1a2 2 0 0 0 4-.006 10 10 0 0 0-8.161-9.826" /> <path d="M20.804 14.869a9 9 0 0 1-17.608 0" /> <circle cx="12" cy="4" r="2" /></symbol><symbol id="i-sandwich" viewBox="0 0 24 24"><path d="m2.37 11.223 8.372-6.777a2 2 0 0 1 2.516 0l8.371 6.777" /> <path d="M21 15a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-5.25" /> <path d="M3 15a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h9" /> <path d="m6.67 15 6.13 4.6a2 2 0 0 0 2.8-.4l3.15-4.2" /> <rect width="20" height="4" x="2" y="11" rx="1" /></symbol><symbol id="i-beef" viewBox="0 0 24 24"><path d="M16.4 13.7A6.5 6.5 0 1 0 6.28 6.6c-1.1 3.13-.78 3.9-3.18 6.08A3 3 0 0 0 5 18c4 0 8.4-1.8 11.4-4.3" /> <path d="m18.5 6 2.19 4.5a6.48 6.48 0 0 1-2.29 7.2C15.4 20.2 11 22 7 22a3 3 0 0 1-2.68-1.66L2.4 16.5" /> <circle cx="12.5" cy="8.5" r="2.5" /></symbol><symbol id="i-fish" viewBox="0 0 24 24"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z" /> <path d="M18 12v.5" /> <path d="M16 17.93a9.77 9.77 0 0 1 0-11.86" /> <path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33" /> <path d="M10.46 7.26C10.2 5.88 9.17 4.24 8 3h5.8a2 2 0 0 1 1.98 1.67l.23 1.4" /> <path d="m16.01 17.93-.23 1.4A2 2 0 0 1 13.8 21H9.5a5.96 5.96 0 0 0 1.49-3.98" /></symbol></svg>

<div id="fisAlani"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   Adfix — Adisyon & Masa Yönetim Sistemi
   Para birimi: her yerde KURUŞ (tam sayı). TL'ye çevirme sadece tl().
   ════════════════════════════════════════════════════════════════ */

const API = location.origin + '/api';

const S = {
  token: localStorage.getItem('adfix_token'),
  kul:   JSON.parse(localStorage.getItem('adfix_kul') || 'null'),
  rota: 'masalar',
  plan: null, menu: null, adisyon: null,
  salon: null, kategori: null,
  sepet: [],                 // gönderilmemiş sipariş satırları
  odeme: { tur: 'nakit', giris: '' },
  zamanlayici: null,
  mutfakBekleyen: 0,
  ayar: null,                // işletme adı, logo, adres… (Yönetim → İşletme)
  gorselTaslak: null,        // ürün/logo düzenleme modalinde bekleyen görsel
};

/* ─────────── ikon ─────────── */
/** Gömülü Lucide sprite'ından ikon basar. `ad` sprite'taki simge adı. */
const ik = (ad, sinif = '') => `<svg class="ik ${sinif}"><use href="#i-${ad}"/></svg>`;

/* ─────────── para & tarih yardımcıları ─────────── */
const tl = k => (Number(k || 0) / 100).toLocaleString('tr-TR',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₺';
const tlSade = k => (Number(k || 0) / 100).toLocaleString('tr-TR',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/** "1.234,50" / "1234,5" / "12.50" → kuruş. Türkçe ve İngilizce ayraç ikisini de anlar. */
function kurusCevir(metin) {
  let s = String(metin ?? '').replace(/[^\d.,-]/g, '').trim();
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const f = parseFloat(s);
  return isNaN(f) ? 0 : Math.round(f * 100);
}

function saatFmt(zaman) {
  if (!zaman) return '';
  return String(zaman).slice(11, 16);
}
function tarihFmt(zaman) {
  if (!zaman) return '';
  const [y, a, g] = String(zaman).slice(0, 10).split('-');
  return `${g}.${a}.${y}`;
}
function gecenSure(baslangic) {
  if (!baslangic) return '';
  const dk = Math.max(0, Math.floor((Date.now() - new Date(String(baslangic).replace(' ', 'T'))) / 60000));
  if (dk < 60) return dk + ' dk';
  return Math.floor(dk / 60) + ' sa ' + (dk % 60) + ' dk';
}
function bugun() { return new Date().toISOString().slice(0, 10); }
const kacis = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ─────────── API ─────────── */
async function istek(yol, secenek = {}) {
  const bas = { 'Content-Type': 'application/json' };
  if (S.token) bas['Authorization'] = 'Bearer ' + S.token;
  const y = await fetch(API + yol, { ...secenek, headers: { ...bas, ...(secenek.headers || {}) } });
  if (y.status === 401) { cikis(); throw new Error('Oturum süresi doldu'); }
  const govde = await y.json().catch(() => ({}));
  if (!y.ok) throw new Error(govde.detail || 'İşlem başarısız (' + y.status + ')');
  return govde;
}
const GET  = y => istek(y);
const POST = (y, v) => istek(y, { method: 'POST', body: JSON.stringify(v || {}) });
const PATCH= (y, v) => istek(y, { method: 'PATCH', body: JSON.stringify(v || {}) });
const SIL  = y => istek(y, { method: 'DELETE' });

/* ─────────── bildirim & modal ─────────── */
function bildir(mesaj, tip = '') {
  const d = document.createElement('div');
  d.className = 'bildirim ' + tip;
  d.textContent = mesaj;
  document.getElementById('bildirimler').appendChild(d);
  setTimeout(() => d.remove(), tip === 'kotu' ? 5200 : 2800);
}
const iyi  = m => bildir(m, 'iyi');
const kotu = m => bildir(m, 'kotu');

function modalAc(baslik, govde, alt = '', genis = false) {
  document.getElementById('modalBaslik').textContent = baslik;
  document.getElementById('modalGovde').innerHTML = govde;
  document.getElementById('modalAlt').innerHTML = alt;
  document.getElementById('modal').className = 'modal' + (genis ? ' genis' : '');
  document.getElementById('perde').classList.add('acik');
}
function modalKapat() { document.getElementById('perde').classList.remove('acik'); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') modalKapat();
});

/** Basit onay penceresi — yıkıcı işlemlerde zorunlu. */
function onay(baslik, mesaj, islevAdi, kirmizi = true) {
  modalAc(baslik, `<p style="line-height:1.65">${mesaj}</p>`,
    `<button class="btn btn-gri" onclick="modalKapat()">Vazgeç</button>
     <button class="btn ${kirmizi ? 'btn-kirmizi' : ''}" onclick="${islevAdi}">Onayla</button>`);
}

/* ─────────── oturum ─────────── */
async function girisYap() {
  const k = document.getElementById('gKullanici').value.trim();
  const s = document.getElementById('gSifre').value;
  const h = document.getElementById('girisHata');
  h.style.display = 'none';
  if (!k || !s) { h.textContent = 'Kullanıcı adı ve şifre gerekli'; h.style.display = 'block'; return; }
  try {
    const y = await POST('/kullanici/giris', { kullanici_adi: k, sifre: s });
    S.token = y.token; S.kul = y.kullanici;
    localStorage.setItem('adfix_token', y.token);
    localStorage.setItem('adfix_kul', JSON.stringify(y.kullanici));
    baslat();
  } catch (e) { h.textContent = e.message; h.style.display = 'block'; }
}
document.getElementById('gSifre').addEventListener('keydown', e => { if (e.key === 'Enter') girisYap(); });
document.getElementById('gKullanici').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('gSifre').focus(); });

function cikis() {
  localStorage.removeItem('adfix_token'); localStorage.removeItem('adfix_kul');
  S.token = null; S.kul = null;
  clearInterval(S.zamanlayici);
  document.getElementById('uygulama').style.display = 'none';
  document.getElementById('girisEkran').style.display = 'flex';
  girisMarkasiYukle();
}

const ROL_AD = { garson: 'Garson', kasiyer: 'Kasiyer', yonetici: 'Yönetici' };
const kasiyerMi = () => S.kul && (S.kul.rol === 'kasiyer' || S.kul.rol === 'yonetici');
const yoneticiMi = () => S.kul && S.kul.rol === 'yonetici';

/* ─────────── menü & yönlendirme ─────────── */
const ROTALAR = [
  { k: 'masalar', ad: 'Masalar',    ikon: 'utensils-crossed', yetki: () => true },
  { k: 'mutfak',  ad: 'Mutfak',     ikon: 'chef-hat', yetki: () => true,
    rozet: () => S.mutfakBekleyen },
  { k: 'gecmis',  ad: 'Adisyonlar', ikon: 'receipt-text', yetki: () => true },
  { k: 'rapor',   ad: 'Raporlar',   ikon: 'chart-column', yetki: () => kasiyerMi() },
  { k: 'urunler', ad: 'Menü',       ikon: 'book-open',    yetki: () => yoneticiMi() },
  { k: 'yonetim', ad: 'Yönetim',    ikon: 'settings',     yetki: () => yoneticiMi() },
];

function menuCiz() {
  document.getElementById('anaMenu').innerHTML = ROTALAR.filter(r => r.yetki()).map(r => {
    const n = r.rozet ? r.rozet() : 0;
    return `<div class="menu-og ${S.rota === r.k ? 'aktif' : ''}" onclick="git('${r.k}')">
      ${ik(r.ikon, 'ik-b')}<span>${r.ad}</span>
      ${n ? `<span class="menu-rozet">${n}</span>` : ''}</div>`;
  }).join('');
}

function yanAc() {
  document.getElementById('yan').classList.add('acik');
  document.getElementById('yanPerde').classList.add('acik');
}
function yanKapat() {
  document.getElementById('yan').classList.remove('acik');
  document.getElementById('yanPerde').classList.remove('acik');
}

function git(rota, veri) {
  S.rota = rota; yanKapat(); menuCiz();
  clearInterval(S.zamanlayici);
  const ciz = {
    masalar: masalarCiz, adisyon: () => adisyonCiz(veri), mutfak: mutfakCiz,
    gecmis: gecmisCiz, rapor: raporCiz, urunler: urunlerCiz, yonetim: yonetimCiz,
  }[rota];
  if (ciz) ciz();
}

function baslikYaz(baslik, alt = '', aksiyon = '') {
  document.getElementById('sayfaBaslik').textContent = baslik;
  document.getElementById('sayfaAlt').innerHTML = alt;
  document.getElementById('ustAksiyon').innerHTML = aksiyon;
}

async function baslat() {
  document.getElementById('girisEkran').style.display = 'none';
  document.getElementById('uygulama').style.display = 'flex';
  document.getElementById('kulAd').textContent = S.kul.ad_soyad;
  document.getElementById('kulRol').textContent = ROL_AD[S.kul.rol] || S.kul.rol;
  try {
    S.menu = await GET('/menu');
    S.ayar = await GET('/ayar');
    ayarUygula();
    await mutfakSayisiTazele();
  } catch (e) { kotu(e.message); }
  menuCiz();
  git('masalar');
}

/** İşletme adı ve logosunu arayüzün her yerine yansıtır. */
function ayarUygula() {
  const a = S.ayar || {};
  const ad = (a.isletme_adi || 'Adfix').trim() || 'Adfix';
  document.title = ad + ' — Adfix Adisyon';
  const yanAd = document.getElementById('yanAd');
  if (yanAd) yanAd.textContent = ad;
  const kutu = document.getElementById('yanLogo');
  if (kutu) kutu.innerHTML = a.logo
    ? `<img src="${a.logo}" alt="">`
    : `<svg class="ik" style="color:#fff"><use href="#i-zap"/></svg>`;
}

/** Giriş ekranı için logo — kimlik doğrulaması gerekmeyen uçtan okunur. */
async function girisMarkasiYukle() {
  try {
    const y = await fetch(API + '/acik/isletme').then(r => r.ok ? r.json() : null);
    if (!y) return;
    if (y.ad) {
      document.getElementById('girisAd').textContent = y.ad;
      document.title = y.ad + ' — Adfix Adisyon';
    }
    document.getElementById('girisSlogan').textContent = y.slogan || 'Adisyonu hallet.';
    if (y.logo) document.getElementById('girisLogo').innerHTML = `<img src="${y.logo}" alt="">`;
  } catch (e) { /* logo yoksa varsayılan marka kalır */ }
}

async function mutfakSayisiTazele() {
  try {
    const m = await GET('/adisyon/mutfak');
    S.mutfakBekleyen = m.length;
    menuCiz();
  } catch (e) { /* sessiz */ }
}

/* açılış — tüm script blokları ayrıştırıldıktan sonra çalışmalı */
window.addEventListener('DOMContentLoaded', () => {
  if (S.token && S.kul) baslat();
  else { document.getElementById('girisEkran').style.display = 'flex'; girisMarkasiYukle(); }
});
</script>

<script>
/* ════════════════ MASA PLANI ════════════════ */

async function masalarCiz() {
  clearInterval(S.zamanlayici);          // kendi kendini yenilerken interval çoğalmasın
  baslikYaz('Masalar', 'Yükleniyor…');
  try { S.plan = await GET('/masa/plan'); }
  catch (e) { kotu(e.message); return; }

  const p = S.plan;
  if (!S.salon || !p.salonlar.some(s => s.id === S.salon))
    S.salon = p.salonlar.length ? p.salonlar[0].id : null;

  baslikYaz('Masalar',
    `<b>${p.ozet.dolu}</b> / ${p.ozet.toplam_masa} masa dolu · Açık hesap:
     <b style="color:var(--ana-koyu)">${tl(p.ozet.acik_tutar)}</b>`,
    `<button class="btn btn-cizgi btn-kucuk" onclick="masalarCiz()">${ik('refresh-cw')} Yenile</button>
     <button class="btn btn-kucuk" onclick="paketAc()">${ik('plus')} Paket / Gel-Al</button>`);

  const salon = p.salonlar.find(s => s.id === S.salon);
  let h = '';

  if (p.salonlar.length > 1)
    h += `<div class="salon-sekme">` + p.salonlar.map(s => {
      const dolu = s.masalar.filter(m => m.adisyon).length;
      return `<div class="sekme ${s.id === S.salon ? 'aktif' : ''}"
        onclick="S.salon=${s.id};masalarCiz()">${kacis(s.ad)}
        <span style="opacity:.7;font-size:11px"> ${dolu}/${s.masalar.length}</span></div>`;
    }).join('') + `</div>`;

  if (p.paket.length) {
    h += `<div class="bolum"><h3>${ik('package')} Paket / Gel-Al <small>${p.paket.length} açık</small></h3>
      <div class="masa-izgara">` + p.paket.map(a => `
      <div class="masa dolu" onclick="git('adisyon',${a.adisyon_id})">
        ${a.bekleyen ? `<span class="masa-rozet">${a.bekleyen} bekliyor</span>` : ''}
        <div class="masa-ad" style="font-size:15px">#${kacis(a.kod)}</div>
        <div class="masa-kap">${kacis(a.musteri_ad || (a.tip === 'paket' ? 'Paket' : 'Gel-Al'))}</div>
        <div class="masa-tutar">${tl(a.kalan)}</div>
        <div class="masa-satir"><span>${a.urun_adet} ürün</span><span>${gecenSure(a.acilis)}</span></div>
      </div>`).join('') + `</div></div>`;
  }

  if (!salon) {
    h += bosDurum('house', 'Henüz salon tanımlanmamış',
      yoneticiMi() ? 'Yönetim → Salon & Masa bölümünden ekleyebilirsiniz.' : 'Yöneticinize bildirin.');
  } else {
    h += `<div class="bolum"><h3>${kacis(salon.ad)}</h3><div class="masa-izgara">` +
      (salon.masalar.length ? salon.masalar.map(m => {
        const a = m.adisyon;
        if (!a) return `<div class="masa" onclick="masaAc(${m.id},'${kacis(m.ad)}')">
            <div class="masa-ad">${kacis(m.ad)}</div>
            <div class="masa-kap">${m.kapasite} kişilik</div>
            <div class="masa-bos">${ik('plus')} Adisyon aç</div></div>`;
        const odendi = a.odenen > 0 && a.kalan === 0;
        return `<div class="masa ${odendi ? 'odendi' : 'dolu'}" onclick="git('adisyon',${a.adisyon_id})">
          ${a.bekleyen ? `<span class="masa-rozet">${a.bekleyen}</span>` : ''}
          <div class="masa-ad">${kacis(m.ad)}</div>
          <div class="masa-kap">#${kacis(a.kod)} · ${a.kisi} kişi</div>
          <div class="masa-tutar">${tl(a.kalan)}</div>
          <div class="masa-satir"><span>${a.urun_adet} ürün</span>
            <span>${ik('clock')} ${gecenSure(a.acilis)}</span></div>
        </div>`;
      }).join('') : `<div class="bos-durum">Bu salonda masa yok</div>`) + `</div></div>`;
  }

  document.getElementById('sayfa').innerHTML = h;
  S.zamanlayici = setInterval(() => { if (S.rota === 'masalar') masalarCiz(); }, 25000);
  mutfakSayisiTazele();
}

function bosDurum(ikon, baslik, alt = '') {
  return `<div class="bos-durum"><div class="ikon">${ik(ikon, 'ik-xl')}</div>
    <div style="font-size:15px;font-weight:600;color:#475569">${baslik}</div>
    <div style="margin-top:5px">${alt}</div></div>`;
}

async function masaAc(masaId, masaAd) {
  modalAc(`${masaAd} — Adisyon Aç`,
    `<div class="alan"><label>Kişi Sayısı</label>
      <input id="mKisi" type="number" min="1" value="2" inputmode="numeric"></div>
     <p style="font-size:12px;color:var(--gri)">Adisyon açıldıktan sonra sipariş ekranına geçilir.</p>`,
    `<button class="btn btn-gri" onclick="modalKapat()">Vazgeç</button>
     <button class="btn" onclick="masaAcOnay(${masaId})">Adisyon Aç</button>`);
  setTimeout(() => document.getElementById('mKisi')?.select(), 60);
}

async function masaAcOnay(masaId) {
  const kisi = parseInt(document.getElementById('mKisi').value) || 1;
  try {
    const a = await POST('/adisyon/ac', { tip: 'masa', masa_id: masaId, kisi });
    modalKapat(); iyi(`#${a.kod} nolu adisyon açıldı`);
    git('adisyon', a.id);
  } catch (e) { kotu(e.message); }
}

function paketAc() {
  modalAc('Paket / Gel-Al Adisyonu',
    `<div class="alan"><label>Tip</label><select id="pTip">
       <option value="paket">Paket (adrese teslim)</option>
       <option value="gel_al">Gel-Al</option></select></div>
     <div class="alan"><label>Müşteri Adı</label><input id="pAd" placeholder="İsteğe bağlı"></div>
     <div class="alan"><label>Telefon</label><input id="pTel" inputmode="tel" placeholder="İsteğe bağlı"></div>
     <div class="alan"><label>Adres</label><textarea id="pAdres" rows="2" placeholder="İsteğe bağlı"></textarea></div>`,
    `<button class="btn btn-gri" onclick="modalKapat()">Vazgeç</button>
     <button class="btn" onclick="paketAcOnay()">Adisyon Aç</button>`);
}

async function paketAcOnay() {
  try {
    const a = await POST('/adisyon/ac', {
      tip: document.getElementById('pTip').value,
      musteri_ad: document.getElementById('pAd').value,
      musteri_tel: document.getElementById('pTel').value,
      musteri_adres: document.getElementById('pAdres').value,
    });
    modalKapat(); iyi(`#${a.kod} nolu adisyon açıldı`);
    git('adisyon', a.id);
  } catch (e) { kotu(e.message); }
}

/* ════════════════ ADİSYON EKRANI ════════════════ */

async function adisyonCiz(aid) {
  if (aid) { S.sepet = []; }
  const id = aid || (S.adisyon && S.adisyon.id);
  if (!id) return git('masalar');
  try { S.adisyon = await GET('/adisyon/' + id); }
  catch (e) { kotu(e.message); return git('masalar'); }
  adisyonYeniden();
}

function adisyonYeniden() {
  const a = S.adisyon, o = a.ozet;
  const yer = a.masa_ad ? `${a.salon_ad || ''} ${a.masa_ad}`.trim()
    : (a.tip === 'paket' ? 'Paket' : 'Gel-Al');
  const kapali = a.durum !== 'acik';

  baslikYaz(`#${a.kod} · ${yer}`,
    `${a.kisi} kişi · ${a.acan_ad || ''} · açılış ${saatFmt(a.acilis)} (${gecenSure(a.acilis)})
     ${kapali ? ` · <span class="etiket-durum d-${a.durum}">${a.durum === 'kapali' ? 'Kapandı' : 'İptal'}</span>` : ''}`,
    `<button class="btn btn-cizgi btn-kucuk" onclick="git('masalar')">${ik('arrow-left')} Masalar</button>
     <button class="btn btn-cizgi btn-kucuk" onclick="fisYazdir()">${ik('printer')} Fiş</button>`);

  if (!S.kategori || !S.menu.some(k => k.id === S.kategori))
    S.kategori = S.menu.length ? S.menu[0].id : null;

  document.getElementById('sayfa').innerHTML = `
    <div class="adisyon-duzen">
      <div class="urun-panel ${kapali ? 'gizli' : ''}">
        <div style="margin-bottom:9px">
          <input id="urunAra" placeholder="Ürün ara…" oninput="urunlerFiltrele()"
            style="width:100%;padding:10px 13px;border:1.5px solid var(--cizgi);border-radius:10px">
        </div>
        <div class="kat-sekme" id="katSekme"></div>
        <div class="urun-izgara" id="urunIzgara"></div>
      </div>
      <div class="sepet-panel" id="sepetPanel"></div>
    </div>`;

  katSekmeCiz(); urunlerFiltrele(); sepetCiz();
}

function katSekmeCiz() {
  document.getElementById('katSekme').innerHTML = S.menu.map(k =>
    `<div class="sekme ${k.id === S.kategori ? 'aktif' : ''}"
      onclick="S.kategori=${k.id};document.getElementById('urunAra').value='';katSekmeCiz();urunlerFiltrele()"
      style="${k.id === S.kategori ? `background:${k.renk};border-color:${k.renk}` : ''}"
      >${ik(k.ikon || 'utensils')} ${kacis(k.ad)}</div>`).join('');
}

function urunlerFiltrele() {
  const q = (document.getElementById('urunAra')?.value || '').toLocaleLowerCase('tr');
  let liste;
  if (q) {
    liste = S.menu.flatMap(k => k.urunler.map(u => ({ ...u, kat: k.ad })))
      .filter(u => u.ad.toLocaleLowerCase('tr').includes(q));
  } else {
    const k = S.menu.find(k => k.id === S.kategori);
    liste = k ? k.urunler.map(u => ({ ...u, kat: k.ad })) : [];
  }
  document.getElementById('urunIzgara').innerHTML = liste.length
    ? liste.map(u => `<div class="urun" onclick="sepeteEkle(${u.id})">
        ${urunGorseli(u)}
        <div class="ad">${kacis(u.ad)}</div>
        <div class="fy">${tlSade(u.fiyat_kurus)}</div></div>`).join('')
    : `<div style="grid-column:1/-1;color:var(--gri);padding:22px;text-align:center">Ürün bulunamadı</div>`;
}

/** Ürün görseli: yüklenmiş fotoğraf varsa onu, yoksa kategorinin renkli ikon karesini basar. */
function urunGorseli(u) {
  if (u.gorsel)
    return `<div class="urun-gorsel"><img src="${u.gorsel}" alt="" loading="lazy"></div>`;
  const k = S.menu.find(k => k.id === u.kategori_id) || {};
  const renk = k.renk || '#F97316';
  return `<div class="urun-gorsel" style="background:${renk}1A;color:${renk}">
    ${ik(k.ikon || 'utensils')}</div>`;
}

function urunBul(id) {
  for (const k of S.menu) { const u = k.urunler.find(u => u.id === id); if (u) return u; }
  return null;
}

function sepeteEkle(urunId) {
  const u = urunBul(urunId);
  if (!u) return;
  const v = S.sepet.find(s => s.urun_id === urunId && !s.notu);
  if (v) v.adet++;
  else S.sepet.push({ urun_id: urunId, ad: u.ad, birim: u.fiyat_kurus, adet: 1, notu: '' });
  sepetCiz();
}

function sepetAdet(i, delta) {
  S.sepet[i].adet += delta;
  if (S.sepet[i].adet < 1) S.sepet.splice(i, 1);
  sepetCiz();
}

function sepetNot(i) {
  const s = S.sepet[i];
  modalAc('Sipariş Notu — ' + s.ad,
    `<div class="alan"><label>Mutfağa iletilecek not</label>
      <input id="sNot" value="${kacis(s.notu)}" placeholder="az pişmiş, soğansız, acılı…"></div>`,
    `<button class="btn btn-gri" onclick="modalKapat()">Vazgeç</button>
     <button class="btn" onclick="S.sepet[${i}].notu=document.getElementById('sNot').value;modalKapat();sepetCiz()">Kaydet</button>`);
  setTimeout(() => document.getElementById('sNot')?.focus(), 60);
}

function sepetCiz() {
  const a = S.adisyon, o = a.ozet, kapali = a.durum !== 'acik';
  const bekleyenTutar = S.sepet.reduce((t, s) => t + s.birim * s.adet, 0);

  const satirlar = a.satirlar.map(s => `
    <div class="sepet-satir ${s.durum === 'ikram' ? 'ikram' : s.durum === 'iptal' ? 'iptal' : ''}">
      <div class="bilgi">
        <div class="ad">${kacis(s.ad)}</div>
        <div class="kck">${s.adet} × ${tlSade(s.birim_kurus)}
          ${s.notu ? ` · <span style="color:var(--ana-koyu)">${kacis(s.notu)}</span>` : ''}
          ${s.durum === 'ikram' ? ' · <b style="color:var(--yesil)">İKRAM</b>' : ''}
          ${s.durum === 'iptal' ? ` · <b style="color:var(--kirmizi)">İPTAL</b>` : ''}
          ${s.durum === 'bekliyor' && s.mutfak ? ` · <span style="color:var(--sari)">${ik('hourglass')} mutfakta</span>` : ''}
        </div>
      </div>
      <div class="tut">${s.durum === 'ikram' || s.durum === 'iptal' ? '—' : tlSade(s.tutar_kurus)}</div>
      ${kapali || s.durum === 'iptal' ? '' :
        `<button class="satir-menu" onclick="satirIslem(${s.id})">⋮</button>`}
    </div>`).join('');

  const sepetSatirlari = S.sepet.map((s, i) => `
    <div class="sepet-satir yeni">
      <div class="bilgi">
        <div class="ad">${kacis(s.ad)}</div>
        <div class="kck">${tlSade(s.birim)} ${s.notu ? `· <span style="color:var(--ana-koyu)">${kacis(s.notu)}</span>` : ''}
          · <a onclick="sepetNot(${i})" style="cursor:pointer;text-decoration:underline">not</a></div>
      </div>
      <div class="adet-kutu">
        <button onclick="sepetAdet(${i},-1)" aria-label="Azalt">${ik('minus')}</button>
        <span>${s.adet}</span>
        <button onclick="sepetAdet(${i},1)" aria-label="Artır">${ik('plus')}</button>
      </div>
      <div class="tut">${tlSade(s.birim * s.adet)}</div>
    </div>`).join('');

  const islemler = kapali ? `
    <button class="btn btn-gri genis" onclick="git('masalar')">Masalara Dön</button>` : `
    ${S.sepet.length ? `<button class="btn btn-yesil genis" onclick="siparisGonder()">
        ${ik('bell-ring')} Siparişi Gönder — ${tl(bekleyenTutar)}</button>` : ''}
    <button class="btn ${o.kalan > 0 ? '' : 'btn-gri'} genis" onclick="odemeAc()"
      ${kasiyerMi() ? '' : 'disabled title="Kasiyer yetkisi gerekli"'}>${ik('credit-card')} Ödeme Al</button>
    <button class="btn btn-cizgi btn-kucuk" onclick="iskontoAc()"
      ${kasiyerMi() ? '' : 'disabled'}>${ik('percent')} İskonto</button>
    <button class="btn btn-cizgi btn-kucuk" onclick="bolAc()">${ik('calculator')} Hesabı Böl</button>
    <button class="btn btn-cizgi btn-kucuk" onclick="tasiAc()">${ik('arrow-left-right')} Taşı</button>
    <button class="btn btn-cizgi btn-kucuk" onclick="birlestirAc()"
      ${kasiyerMi() ? '' : 'disabled'}>${ik('link')} Birleştir</button>
    <button class="btn btn-cizgi btn-kucuk" onclick="bilgiAc()">${ik('pencil')} Bilgi</button>
    <button class="btn ${o.kalan === 0 && o.ara_toplam > 0 ? 'btn-yesil' : 'btn-cizgi'} btn-kucuk"
      onclick="adisyonKapat()" ${kasiyerMi() ? '' : 'disabled'}>${ik('check')} Hesabı Kapat</button>
    ${yoneticiMi() ? `<button class="btn btn-cizgi btn-kucuk genis" style="color:var(--kirmizi)"
      onclick="adisyonIptalAc()">${ik('x')} Adisyonu İptal Et</button>` : ''}`;

  document.getElementById('sepetPanel').innerHTML = `
    <div class="sepet-ust">
      <h3>Adisyon #${kacis(a.kod)}</h3>
      <div class="alt">${a.masa_ad ? kacis(a.masa_ad) : (a.tip === 'paket' ? 'Paket' : 'Gel-Al')}
        · ${a.kisi} kişi ${a.musteri_ad ? '· ' + kacis(a.musteri_ad) : ''}</div>
    </div>
    <div class="sepet-liste">
      ${satirlar || (S.sepet.length ? '' : `<div style="padding:26px;text-align:center;
        color:var(--gri);font-size:13px">Henüz sipariş yok.<br>Soldan ürün seçin.</div>`)}
      ${S.sepet.length ? `<div style="padding:7px 14px;font-size:11px;font-weight:700;
        color:var(--sari);background:#FFFBEB;border-top:1px solid #FDE68A">
        GÖNDERİLMEYİ BEKLEYEN</div>${sepetSatirlari}` : ''}
    </div>
    <div class="sepet-alt">
      <div class="top-satir"><span>Ara Toplam</span><span class="para">${tl(o.ara_toplam)}</span></div>
      ${o.ikram ? `<div class="top-satir yesil"><span>İkram</span><span class="para">−${tl(o.ikram)}</span></div>` : ''}
      ${o.iskonto ? `<div class="top-satir yesil"><span>İskonto ${a.iskonto_not ? '(' + kacis(a.iskonto_not) + ')' : ''}</span>
        <span class="para">−${tl(o.iskonto)}</span></div>` : ''}
      ${o.odenen ? `<div class="top-satir"><span>Ödenen</span><span class="para">${tl(o.odenen)}</span></div>` : ''}
      <div class="top-satir buyuk"><span>${o.odenen ? 'KALAN' : 'TOPLAM'}</span>
        <span class="para">${tl(o.odenen ? o.kalan : o.net_toplam)}</span></div>
      ${bekleyenTutar ? `<div class="top-satir" style="color:var(--sari)">
        <span>+ Bekleyen sipariş</span><span class="para">${tl(bekleyenTutar)}</span></div>` : ''}
      <div class="islem-sira">${islemler}</div>
    </div>`;
}

async function siparisGonder() {
  if (!S.sepet.length) return;
  try {
    S.adisyon = await POST(`/adisyon/${S.adisyon.id}/siparis`, {
      satirlar: S.sepet.map(s => ({ urun_id: s.urun_id, adet: s.adet, notu: s.notu })),
    });
    const n = S.sepet.length; S.sepet = [];
    adisyonYeniden(); mutfakSayisiTazele();
    iyi(`${n} kalem sipariş mutfağa gönderildi`);
  } catch (e) { kotu(e.message); }
}

function satirIslem(sid) {
  const s = S.adisyon.satirlar.find(x => x.id === sid);
  if (!s) return;
  modalAc(s.ad, `
    <div style="font-size:12.5px;color:var(--gri);margin-bottom:14px">
      ${s.adet} × ${tlSade(s.birim_kurus)} = <b>${tlSade(s.tutar_kurus)}</b>
      · ekleyen: ${kacis(s.ekleyen_ad || '-')} · ${saatFmt(s.eklenme)}</div>
    <div class="alan"><label>Adet</label>
      <input id="iAdet" type="number" min="1" value="${s.adet}" inputmode="numeric"></div>
    <div class="alan"><label>Not</label><input id="iNot" value="${kacis(s.notu)}"></div>`,
    `<button class="btn btn-cizgi btn-kucuk" onclick="satirIptalAc(${sid})"
       style="color:var(--kirmizi);margin-right:auto">${ik('trash-2')} İptal Et</button>
     ${kasiyerMi() && s.durum !== 'ikram' ? `<button class="btn btn-cizgi btn-kucuk"
       onclick="satirDurum(${sid},'ikram')" style="color:var(--yesil)">${ik('gift')} İkram</button>` : ''}
     ${s.durum === 'ikram' ? `<button class="btn btn-cizgi btn-kucuk"
       onclick="satirDurum(${sid},'hazir')">İkramı Geri Al</button>` : ''}
     <button class="btn" onclick="satirKaydet(${sid})">Kaydet</button>`);
}

async function satirKaydet(sid) {
  const adet = parseInt(document.getElementById('iAdet').value) || 1;
  const notu = document.getElementById('iNot').value;
  try {
    S.adisyon = await PATCH('/adisyon/satir/' + sid, { adet, notu });
    modalKapat(); adisyonYeniden(); iyi('Satır güncellendi');
  } catch (e) { kotu(e.message); }
}

async function satirDurum(sid, durum) {
  try {
    S.adisyon = await PATCH('/adisyon/satir/' + sid, { durum });
    modalKapat(); adisyonYeniden();
    iyi(durum === 'ikram' ? 'Ürün ikram edildi' : 'Güncellendi');
  } catch (e) { kotu(e.message); }
}

function satirIptalAc(sid) {
  const s = S.adisyon.satirlar.find(x => x.id === sid);
  modalAc('Satır İptali — ' + s.ad,
    `<p style="margin-bottom:14px;font-size:13px;line-height:1.6">
      <b>${s.adet} × ${kacis(s.ad)}</b> adisyondan düşülecek.
      Kayıt silinmez, iptal olarak işaretlenir ve kim iptal etti raporda görünür.</p>
     <div class="alan"><label>İptal Sebebi (zorunlu)</label>
       <input id="iSebep" placeholder="yanlış giriş, müşteri vazgeçti…"></div>`,
    `<button class="btn btn-gri" onclick="modalKapat()">Vazgeç</button>
     <button class="btn btn-kirmizi" onclick="satirIptalOnay(${sid})">İptal Et</button>`);
  setTimeout(() => document.getElementById('iSebep')?.focus(), 60);
}

async function satirIptalOnay(sid) {
  const sebep = document.getElementById('iSebep').value.trim();
  if (!sebep) return kotu('İptal sebebi zorunlu');
  try {
    S.adisyon = await PATCH('/adisyon/satir/' + sid, { durum: 'iptal', sebep });
    modalKapat(); adisyonYeniden(); mutfakSayisiTazele(); iyi('Satır iptal edildi');
  } catch (e) { kotu(e.message); }
}
</script>

<script>
/* ════════════════ ÖDEME ════════════════ */

const ODEME_AD = { nakit: 'Nakit', kart: 'Kredi Kartı', yemek_ceki: 'Yemek Çeki', acik_hesap: 'Açık Hesap' };
const ODEME_IK = { nakit: 'banknote', kart: 'credit-card',
                   yemek_ceki: 'ticket', acik_hesap: 'notebook-pen' };
/** Ödeme türü ikonu — satır içi kullanım için hazır SVG döner. */
const odemeIk = t => ik(ODEME_IK[t] || 'credit-card');

function odemeAc() {
  if (!kasiyerMi()) return kotu('Ödeme almak için kasiyer yetkisi gerekli');
  const o = S.adisyon.ozet;
  if (o.kalan <= 0) return kotu('Bu adisyonda ödenecek tutar kalmadı');
  S.odeme = { tur: 'nakit', giris: String(o.kalan) };
  odemeCiz();
}

function odemeCiz() {
  const a = S.adisyon, o = a.ozet;
  const girilen = parseInt(S.odeme.giris || '0', 10) || 0;
  const nakit = S.odeme.tur === 'nakit';
  const kaydedilecek = Math.min(girilen, o.kalan);
  const ustu = nakit ? Math.max(0, girilen - o.kalan) : 0;

  const gecmisOdeme = a.odemeler.length ? `
    <div style="margin-top:16px;border-top:1px solid var(--cizgi);padding-top:12px">
      <div style="font-size:11px;font-weight:700;color:var(--gri);text-transform:uppercase;
        letter-spacing:.05em;margin-bottom:7px">Alınan Ödemeler</div>
      ${a.odemeler.map(p => `<div style="display:flex;justify-content:space-between;
        align-items:center;font-size:12.5px;padding:5px 0;border-bottom:1px solid #F1F5F9">
        <span>${odemeIk(p.tur)} ${ODEME_AD[p.tur]}
          <span style="color:var(--gri)">· ${saatFmt(p.zaman)} · ${kacis(p.alan_ad || '')}</span></span>
        <span><b class="para">${tl(p.tutar_kurus)}</b>
        ${yoneticiMi() ? `<button class="satir-menu" title="Ödemeyi sil"
          onclick="odemeSil(${p.id})">${ik('trash-2')}</button>` : ''}</span></div>`).join('')}
    </div>` : '';

  modalAc('Ödeme Al — #' + a.kod, `
    <div class="odeme-ozet">
      <div class="kalan-et">Kalan Tutar</div>
      <div class="kalan">${tl(o.kalan)}</div>
      <div class="detay">Toplam ${tl(o.net_toplam)}${o.odenen ? ` · Ödenen ${tl(o.odenen)}` : ''}
        ${o.iskonto ? ` · İskonto ${tl(o.iskonto)}` : ''}</div>
    </div>
    <div class="tur-sec">
      ${Object.keys(ODEME_AD).map(t => `<div class="tur ${S.odeme.tur === t ? 'aktif' : ''}"
        onclick="S.odeme.tur='${t}';odemeCiz()">
        <span class="tur-ik">${ik(ODEME_IK[t], 'ik-b')}</span>${ODEME_AD[t]}</div>`).join('')}
    </div>
    <div class="tutar-goster">${tlSade(girilen)} ₺</div>
    <div class="hizli-sira">
      <button class="hizli" onclick="odemeTutar(${o.kalan})">Tam tutar</button>
      ${[5000, 10000, 20000, 50000].map(v =>
        `<button class="hizli" onclick="odemeEkle(${v})">+${v / 100}</button>`).join('')}
      ${o.kalan > 1 ? `<button class="hizli" onclick="odemeTutar(${Math.ceil(o.kalan / 2)})">Yarısı</button>` : ''}
    </div>
    <div class="tus-takim">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="tus" onclick="odemeTus('${n}')">${n}</button>`).join('')}
      <button class="tus islem" onclick="odemeTus('00')">00</button>
      <button class="tus" onclick="odemeTus('0')">0</button>
      <button class="tus islem" onclick="odemeSil2()">${ik('delete')}</button>
    </div>
    ${ustu ? `<div class="ustu-kutu"><span>Para üstü</span><b>${tl(ustu)}</b></div>` : ''}
    ${girilen > o.kalan && !nakit ? `<div class="hata" style="display:block;margin-top:11px">
      Kalan tutardan fazla ${ODEME_AD[S.odeme.tur].toLowerCase()} ödemesi kaydedilemez.</div>` : ''}
    ${gecmisOdeme}`,
    `<button class="btn btn-gri" onclick="modalKapat()">Kapat</button>
     <button class="btn btn-yesil" ${kaydedilecek > 0 && !(girilen > o.kalan && !nakit) ? '' : 'disabled'}
       onclick="odemeKaydet()">${tl(kaydedilecek)} Tahsil Et</button>`);
}

function odemeTus(rakam) {
  S.odeme.giris = String((S.odeme.giris === '0' ? '' : S.odeme.giris) + rakam).slice(0, 9);
  odemeCiz();
}
function odemeSil2() { S.odeme.giris = S.odeme.giris.slice(0, -1) || '0'; odemeCiz(); }
function odemeTutar(k) { S.odeme.giris = String(k); odemeCiz(); }
function odemeEkle(k) { S.odeme.giris = String((parseInt(S.odeme.giris || '0', 10) || 0) + k); odemeCiz(); }

async function odemeKaydet() {
  const o = S.adisyon.ozet;
  const girilen = parseInt(S.odeme.giris || '0', 10) || 0;
  const tutar = Math.min(girilen, o.kalan);
  if (tutar <= 0) return;
  const ustu = S.odeme.tur === 'nakit' ? Math.max(0, girilen - o.kalan) : 0;
  try {
    S.adisyon = await POST(`/adisyon/${S.adisyon.id}/odeme`,
      { tur: S.odeme.tur, tutar_kurus: tutar });
    adisyonYeniden();
    iyi(`${tl(tutar)} ${ODEME_AD[S.odeme.tur].toLowerCase()} alındı` +
        (ustu ? ` · Para üstü ${tl(ustu)}` : ''));
    if (S.adisyon.ozet.kalan === 0) {
      modalAc('Hesap Tamamlandı',
        `<p style="line-height:1.7;font-size:14px">
          <b>#${S.adisyon.kod}</b> adisyonunun tamamı tahsil edildi.
          ${ustu ? `<br><br>Müşteriye <b style="color:var(--yesil);font-size:17px">${tl(ustu)}</b>
            para üstü verilecek.` : ''}
          <br><br>Adisyonu kapatınca masa boşa düşer.</p>`,
        `<button class="btn btn-cizgi" onclick="fisYazdir()">${ik('printer')} Fiş Yazdır</button>
         <button class="btn btn-gri" onclick="modalKapat()">Sonra</button>
         <button class="btn btn-yesil" onclick="adisyonKapat()">Hesabı Kapat</button>`);
    } else { S.odeme.giris = String(S.adisyon.ozet.kalan); odemeCiz(); }
  } catch (e) { kotu(e.message); }
}

async function odemeSil(oid) {
  try {
    S.adisyon = await SIL('/adisyon/odeme/' + oid);
    adisyonYeniden(); S.odeme.giris = String(S.adisyon.ozet.kalan); odemeCiz();
    iyi('Ödeme kaydı silindi');
  } catch (e) { kotu(e.message); }
}

/* ════════════════ İSKONTO / BÖLME / TAŞIMA ════════════════ */

function iskontoAc() {
  const o = S.adisyon.ozet;
  modalAc('İskonto — #' + S.adisyon.kod, `
    <div style="font-size:13px;color:var(--gri);margin-bottom:14px">
      Ara toplam <b style="color:#0F172A">${tl(o.ara_toplam)}</b>
      ${o.iskonto ? ` · mevcut iskonto <b style="color:var(--yesil)">${tl(o.iskonto)}</b>` : ''}</div>
    <div class="hizli-sira" style="margin-bottom:14px">
      ${[5, 10, 15, 20, 25, 50].map(y => `<button class="hizli"
        onclick="iskontoUygula('yuzde',${y})">%${y}</button>`).join('')}
      ${o.iskonto ? `<button class="hizli" style="color:var(--kirmizi)"
        onclick="iskontoUygula('tutar',0)">İskontoyu kaldır</button>` : ''}
    </div>
    <div class="alan"><label>Tutar iskontosu (TL)</label>
      <input id="isTutar" inputmode="decimal" placeholder="örn. 50,00"></div>
    <div class="alan"><label>Açıklama</label>
      <input id="isNot" placeholder="personel indirimi, kampanya…"></div>`,
    `<button class="btn btn-gri" onclick="modalKapat()">Vazgeç</button>
     <button class="btn" onclick="iskontoUygula('tutar',kurusCevir(document.getElementById('isTutar').value))">Uygula</button>`);
}

async function iskontoUygula(tip, deger) {
  try {
    const aciklama = document.getElementById('isNot')?.value || '';
    S.adisyon = await POST(`/adisyon/${S.adisyon.id}/iskonto`, { tip, deger, aciklama });
    modalKapat(); adisyonYeniden();
    iyi(deger ? 'İskonto uygulandı' : 'İskonto kaldırıldı');
  } catch (e) { kotu(e.message); }
}

async function bolAc(kisi) {
  const a = S.adisyon;
  const n = kisi || a.kisi;
  try {
    const b = await GET(`/adisyon/${a.id}/bol?kisi=${n}`);
    modalAc('Hesabı Böl — #' + a.kod, `
      <div style="display:flex;gap:9px;align-items:center;margin-bottom:16px">
        <label style="font-size:12.5px;font-weight:600">Kişi sayısı</label>
        <input id="bKisi" type="number" min="1" value="${n}" inputmode="numeric"
          style="width:80px;padding:8px 11px;border:1.5px solid var(--cizgi);border-radius:9px">
        <button class="btn btn-kucuk" onclick="bolAc(parseInt(document.getElementById('bKisi').value)||1)">Hesapla</button>
      </div>
      <div style="background:var(--zemin);border-radius:11px;padding:15px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:9px">
          <span>Toplam</span><b class="para">${tl(b.net_toplam)}</b></div>
        ${b.paylar.map((p, i) => `<div style="display:flex;justify-content:space-between;
          font-size:14px;padding:6px 0;border-top:1px dashed #CBD5E1">
          <span>${i + 1}. kişi</span><b class="para">${tl(p)}</b></div>`).join('')}
      </div>
      <p style="font-size:11.5px;color:var(--gri);margin-top:11px;line-height:1.6">
        Kuruş artığı ilk kişilere dağıtılır; payların toplamı hesabın tam tutarını verir
        (kontrol: <b>${tl(b.kontrol_toplam)}</b>).<br>
        Ödemeleri "Ödeme Al" ekranından parça parça alabilirsiniz.</p>`,
      `<button class="btn btn-gri" onclick="modalKapat()">Kapat</button>
       ${kasiyerMi() ? `<button class="btn" onclick="modalKapat();S.odeme={tur:'nakit',giris:'${b.paylar[0]}'};odemeCiz()">
         İlk payı tahsil et</button>` : ''}`);
  } catch (e) { kotu(e.message); }
}

async function tasiAc() {
  try {
    const plan = await GET('/masa/plan');
    const bos = plan.salonlar.flatMap(s => s.masalar.filter(m => !m.adisyon)
      .map(m => ({ ...m, salon: s.ad })));
    if (!bos.length) return kotu('Boş masa yok');
    modalAc('Masayı Taşı — #' + S.adisyon.kod, `
      <p style="font-size:13px;color:var(--gri);margin-bottom:13px">
        Adisyon seçilen boş masaya taşınır. Siparişler ve ödemeler aynen gider.</p>
      <div class="alan"><label>Hedef Masa</label><select id="tMasa">
        ${bos.map(m => `<option value="${m.id}">${kacis(m.salon)} — ${kacis(m.ad)}
          (${m.kapasite} kişilik)</option>`).join('')}</select></div>`,
      `<button class="btn btn-gri" onclick="modalKapat()">Vazgeç</button>
       <button class="btn" onclick="tasiOnay()">Taşı</button>`);
  } catch (e) { kotu(e.message); }
}

async function tasiOnay() {
  try {
    S.adisyon = await POST(`/adisyon/${S.adisyon.id}/tasi`,
      { hedef_masa_id: parseInt(document.getElementById('tMasa').value) });
    modalKapat(); adisyonYeniden(); iyi('Adisyon taşındı');
  } catch (e) { kotu(e.message); }
}

async function birlestirAc() {
  try {
    const liste = (await GET('/adisyon/acik')).filter(a => a.id !== S.adisyon.id);
    if (!liste.length) return kotu('Birleştirilecek başka açık adisyon yok');
    modalAc('Adisyon Birleştir', `
      <p style="font-size:13px;color:var(--gri);margin-bottom:13px;line-height:1.6">
        Seçilen adisyonun tüm siparişleri, ödemeleri ve kişi sayısı
        <b>#${kacis(S.adisyon.kod)}</b> üzerine aktarılır; kaynak masa boşalır.
        Bu işlem geri alınamaz.</p>
      <div class="alan"><label>Buraya taşınacak adisyon</label><select id="bAdisyon">
        ${liste.map(a => `<option value="${a.id}">#${kacis(a.kod)} —
          ${kacis(a.masa_ad || (a.tip === 'paket' ? 'Paket' : 'Gel-Al'))}
          · ${tlSade(a.ozet.net_toplam)} ₺ · ${a.kisi} kişi</option>`).join('')}</select></div>`,
      `<button class="btn btn-gri" onclick="modalKapat()">Vazgeç</button>
       <button class="btn" onclick="birlestirOnay()">Birleştir</button>`);
  } catch (e) { kotu(e.message); }
}

async function birlestirOnay() {
  try {
    S.adisyon = await POST(`/adisyon/${S.adisyon.id}/birlestir`,
      { kaynak_adisyon_id: parseInt(document.getElementById('bAdisyon').value) });
    modalKapat(); adisyonYeniden(); iyi('Adisyonlar birleştirildi');
  } catch (e) { kotu(e.message); }
}

function bilgiAc() {
  const a = S.adisyon;
  modalAc('Adisyon Bilgileri — #' + a.kod, `
    <div class="alan"><label>Kişi Sayısı</label>
      <input id="dKisi" type="number" min="1" value="${a.kisi}" inputmode="numeric"></div>
    <div class="alan"><label>Müşteri Adı</label>
      <input id="dAd" value="${kacis(a.musteri_ad)}"></div>
    <div class="alan"><label>Telefon</label>
      <input id="dTel" value="${kacis(a.musteri_tel)}" inputmode="tel"></div>
    <div class="alan"><label>Adres</label>
      <textarea id="dAdres" rows="2">${kacis(a.musteri_adres)}</textarea></div>
    <div class="alan"><label>Adisyon Notu</label>
      <input id="dNot" value="${kacis(a.aciklama)}" placeholder="doğum günü, rezervasyon…"></div>`,
    `<button class="btn btn-gri" onclick="modalKapat()">Vazgeç</button>
     <button class="btn" onclick="bilgiKaydet()">Kaydet</button>`);
}

async function bilgiKaydet() {
  try {
    S.adisyon = await PATCH(`/adisyon/${S.adisyon.id}/bilgi`, {
      kisi: parseInt(document.getElementById('dKisi').value) || 1,
      musteri_ad: document.getElementById('dAd').value,
      musteri_tel: document.getElementById('dTel').value,
      musteri_adres: document.getElementById('dAdres').value,
      aciklama: document.getElementById('dNot').value,
    });
    modalKapat(); adisyonYeniden(); iyi('Bilgiler güncellendi');
  } catch (e) { kotu(e.message); }
}

async function adisyonKapat() {
  const o = S.adisyon.ozet;
  if (o.kalan > 0) return kotu(`Ödenmemiş ${tl(o.kalan)} var — önce tahsil edin`);
  try {
    await POST(`/adisyon/${S.adisyon.id}/kapat`);
    modalKapat(); iyi(`#${S.adisyon.kod} kapatıldı · ${tl(o.net_toplam)}`);
    git('masalar');
  } catch (e) { kotu(e.message); }
}

function adisyonIptalAc() {
  modalAc('Adisyonu İptal Et', `
    <p style="line-height:1.65;font-size:13.5px">
      <b>#${kacis(S.adisyon.kod)}</b> adisyonunun tüm satırları iptal edilecek ve masa boşalacak.
      Ciroya girmez. Alınmış ödeme varsa önce silinmelidir.</p>
    <div class="alan" style="margin-top:14px"><label>İptal Sebebi (zorunlu)</label>
      <input id="aiSebep" placeholder="müşteri gitti, yanlış açıldı…"></div>`,
    `<button class="btn btn-gri" onclick="modalKapat()">Vazgeç</button>
     <button class="btn btn-kirmizi" onclick="adisyonIptalOnay()">Adisyonu İptal Et</button>`);
}

async function adisyonIptalOnay() {
  const sebep = document.getElementById('aiSebep').value.trim();
  if (!sebep) return kotu('İptal sebebi zorunlu');
  try {
    await POST(`/adisyon/${S.adisyon.id}/iptal`, { sebep });
    modalKapat(); iyi('Adisyon iptal edildi'); git('masalar');
  } catch (e) { kotu(e.message); }
}

/* ════════════════ FİŞ ════════════════ */

function fisYazdir() {
  const a = S.adisyon, o = a.ozet;
  const sat = a.satirlar.filter(s => s.durum !== 'iptal');
  const ay = S.ayar || {};
  document.getElementById('fisAlani').innerHTML = `
    ${ay.logo ? `<div class="fis-orta"><img class="fis-logo" src="${ay.logo}" alt=""></div>` : ''}
    <div class="fis-baslik">${kacis(ay.isletme_adi ? ay.isletme_adi.toLocaleUpperCase('tr') : 'ADFIX')}</div>
    ${ay.slogan ? `<div class="fis-orta fis-kucuk">${kacis(ay.slogan)}</div>` : ''}
    ${ay.adres  ? `<div class="fis-orta fis-kucuk">${kacis(ay.adres)}</div>` : ''}
    ${ay.telefon ? `<div class="fis-orta fis-kucuk">Tel: ${kacis(ay.telefon)}</div>` : ''}
    <div class="fis-orta fis-kucuk">Adisyon Fişi (mali değeri yoktur)</div>
    <div class="fis-ayrac"></div>
    <div class="fis-sat"><span>Adisyon</span><span>#${kacis(a.kod)}</span></div>
    <div class="fis-sat"><span>${a.masa_ad ? 'Masa' : 'Tip'}</span>
      <span>${kacis(a.masa_ad || (a.tip === 'paket' ? 'Paket' : 'Gel-Al'))}</span></div>
    <div class="fis-sat"><span>Kişi</span><span>${a.kisi}</span></div>
    <div class="fis-sat"><span>Tarih</span><span>${tarihFmt(a.acilis)} ${saatFmt(a.acilis)}</span></div>
    <div class="fis-sat"><span>Personel</span><span>${kacis(a.acan_ad || '-')}</span></div>
    ${a.musteri_ad ? `<div class="fis-sat"><span>Müşteri</span><span>${kacis(a.musteri_ad)}</span></div>` : ''}
    ${a.musteri_tel ? `<div class="fis-sat"><span>Telefon</span><span>${kacis(a.musteri_tel)}</span></div>` : ''}
    <div class="fis-ayrac"></div>
    ${sat.map(s => `
      <div class="fis-sat"><span>${s.adet} x ${kacis(s.ad)}</span>
        <span>${s.durum === 'ikram' ? 'İKRAM' : tlSade(s.tutar_kurus)}</span></div>
      ${s.notu ? `<div class="fis-kucuk">   (${kacis(s.notu)})</div>` : ''}`).join('')}
    <div class="fis-ayrac"></div>
    <div class="fis-sat"><span>Ara Toplam</span><span>${tlSade(o.ara_toplam)}</span></div>
    ${o.ikram ? `<div class="fis-sat"><span>İkram</span><span>-${tlSade(o.ikram)}</span></div>` : ''}
    ${o.iskonto ? `<div class="fis-sat"><span>İskonto</span><span>-${tlSade(o.iskonto)}</span></div>` : ''}
    <div class="fis-ayrac"></div>
    <div class="fis-sat fis-buyuk"><span>TOPLAM</span><span>${tlSade(o.net_toplam)} TL</span></div>
    ${a.odemeler.map(p => `<div class="fis-sat fis-kucuk"><span>${ODEME_AD[p.tur]}</span>
      <span>${tlSade(p.tutar_kurus)}</span></div>`).join('')}
    ${o.kalan > 0 ? `<div class="fis-sat"><span>KALAN</span><span>${tlSade(o.kalan)} TL</span></div>` : ''}
    ${a.kisi > 1 ? `<div class="fis-ayrac"></div>
      <div class="fis-sat fis-kucuk"><span>Kişi başı (${a.kisi})</span>
        <span>${tlSade(Math.ceil(o.net_toplam / a.kisi))}</span></div>` : ''}
    <div class="fis-ayrac"></div>
    <div class="fis-orta fis-kucuk">${kacis(ay.fis_alt_not || 'Afiyet olsun · Teşekkür ederiz')}<br>
      ${new Date().toLocaleString('tr-TR')}</div>`;
  window.print();
}
</script>

<script>
/* ════════════════ MUTFAK EKRANI ════════════════ */

async function mutfakCiz() {
  clearInterval(S.zamanlayici);          // kendi kendini yenilerken interval çoğalmasın
  let liste;
  try { liste = await GET('/adisyon/mutfak'); }
  catch (e) { return kotu(e.message); }
  S.mutfakBekleyen = liste.length; menuCiz();

  const gruplar = {};
  liste.forEach(s => { (gruplar[s.adisyon_id] ||= { ...s, satirlar: [] }).satirlar.push(s); });
  const kartlar = Object.values(gruplar);

  baslikYaz('Mutfak', `<b>${liste.length}</b> kalem hazırlanmayı bekliyor · ekran 15 sn'de bir yenilenir`,
    `<button class="btn btn-cizgi btn-kucuk" onclick="mutfakCiz()">${ik('refresh-cw')} Yenile</button>`);

  document.getElementById('sayfa').innerHTML = kartlar.length ? `
    <div class="mutfak-izgara">` + kartlar.map(k => {
      const dk = Math.max(...k.satirlar.map(s => s.bekleme_dk || 0));
      const sinif = dk >= 20 ? 'gecikti' : dk >= 10 ? 'uyari' : '';
      return `<div class="fis-kart ${sinif}">
        <div class="fis-ust">
          <div>
            <div class="fis-masa">${kacis(k.masa_ad || (k.tip === 'paket' ? 'Paket' : 'Gel-Al'))}</div>
            <div class="fis-garson">#${kacis(k.kod)} · ${kacis(k.ekleyen_ad || '')}</div>
          </div>
          <div class="fis-sure ${dk >= 20 ? 'gec' : ''}">${dk} dk</div>
        </div>
        ${k.satirlar.map(s => `<div class="fis-urun">
          <span class="adet">${s.adet}</span>${kacis(s.ad)}
          ${s.notu ? `<div class="fis-not">${ik('corner-down-right')} ${kacis(s.notu)}</div>` : ''}</div>`).join('')}
        <div class="fis-alt">
          <span class="fis-garson">${saatFmt(k.satirlar[0].eklenme)}</span>
          <button class="btn btn-yesil btn-kucuk"
            onclick="mutfakHazir([${k.satirlar.map(s => s.id).join(',')}])">${ik('check')} Hazır</button>
        </div></div>`;
    }).join('') + `</div>`
    : bosDurum('party-popper', 'Mutfak temiz!', 'Bekleyen sipariş yok.');

  S.zamanlayici = setInterval(() => { if (S.rota === 'mutfak') mutfakCiz(); }, 15000);
}

async function mutfakHazir(idler) {
  try {
    for (const id of idler) await POST(`/adisyon/satir/${id}/hazir`);
    iyi(idler.length + ' kalem hazır olarak işaretlendi');
    mutfakCiz();
  } catch (e) { kotu(e.message); }
}

/* ════════════════ ADİSYON GEÇMİŞİ ════════════════ */

async function gecmisCiz(bas, bit) {
  bas ||= bugun(); bit ||= bugun();

    <input type="date" id="gBas" value="${bas}" style="padding:6px 9px;border:1.5px solid var(--cizgi);border-radius:8px">
    <input type="date" id="gBit" value="${bit}" style="padding:6px 9px;border:1.5px solid var(--cizgi);border-radius:8px">
    <button class="btn btn-kucuk" onclick="gecmisCiz(document.getElementById('gBas').value,document.getElementById('gBit').value)">Getir</button>`);
  let liste;
  try { liste = await GET(`/adisyon/gecmis?bas=${bas}&bit=${bit}`); }
  catch (e) { return kotu(e.message); }

  const kapali = liste.filter(a => a.durum === 'kapali');

  document.getElementById('sayfa').innerHTML = `
    <div class="kart-sira">
      <div class="ozet-kart"><div class="etiket">Kapanan Adisyon</div>

      <div class="ozet-kart vurgu"><div class="etiket">Toplam Ciro</div>
        <div class="deger">${tl(ciro)}</div></div>
      <div class="ozet-kart"><div class="etiket">Ortalama Adisyon</div>
        <div class="deger">${tl(kapali.length ? Math.round(ciro / kapali.length) : 0)}</div></div>
      <div class="ozet-kart"><div class="etiket">İptal</div>
        <div class="deger">${liste.length - kapali.length}</div></div>
    </div>
    <div class="tablo-sar"><table>
      <thead><tr><th>No</th><th>Yer</th><th>Durum</th><th>Açılış</th><th>Kapanış</th>
        <th class="sag">Tutar</th><th class="sag">Ödenen</th><th>Kapatan</th><th></th></tr></thead>
      <tbody>${liste.length ? liste.map(a => `<tr>
        <td><b>#${kacis(a.kod)}</b></td>
        <td>${kacis(a.masa_ad || (a.tip === 'paket' ? 'Paket' : 'Gel-Al'))}</td>
        <td><span class="etiket-durum d-${a.durum}">${a.durum === 'kapali' ? 'Kapandı' : 'İptal'}</span></td>
        <td>${tarihFmt(a.acilis)} ${saatFmt(a.acilis)}</td>
        <td>${a.kapanis ? saatFmt(a.kapanis) : '—'}</td>
        <td class="sag para">${tl(a.ozet.net_toplam)}</td>
        <td class="sag para">${tl(a.ozet.odenen)}</td>
        <td>${kacis(a.kapatan_ad || '—')}</td>
        <td><button class="btn btn-cizgi btn-kucuk" onclick="gecmisDetay(${a.id})">Detay</button></td>
      </tr>`).join('') : `<tr><td colspan="9" style="text-align:center;padding:26px;color:var(--gri)">
        Bu tarih aralığında adisyon yok</td></tr>`}</tbody>
    </table></div>`;
}

  try {

    modalAc(`Adisyon #${a.kod}`, `
      <div style="font-size:12.5px;color:var(--gri);margin-bottom:13px;line-height:1.7">
        ${kacis(a.masa_ad || (a.tip === 'paket' ? 'Paket' : 'Gel-Al'))} · ${a.kisi} kişi ·
        ${tarihFmt(a.acilis)} ${saatFmt(a.acilis)}${a.kapanis ? ' – ' + saatFmt(a.kapanis) : ''}<br>
        Açan: ${kacis(a.acan_ad || '-')}${a.kapatan_ad ? ' · Kapatan: ' + kacis(a.kapatan_ad) : ''}
        ${a.iptal_sebep ? `<br><b style="color:var(--kirmizi)">İptal: ${kacis(a.iptal_sebep)}</b>` : ''}
      </div>
      <div class="tablo-sar"><table><tbody>
        ${a.satirlar.map(s => `<tr${s.durum === 'iptal' ? ' style="opacity:.55;text-decoration:line-through"' : ''}>

          <td class="sag para">${s.durum === 'ikram' ? '<b style="color:var(--yesil)">İKRAM</b>'

      </tbody></table></div>

        <div class="top-satir"><span>Ara Toplam</span><span class="para">${tl(o.ara_toplam)}</span></div>

        ${o.iskonto ? `<div class="top-satir yesil"><span>İskonto</span><span class="para">−${tl(o.iskonto)}</span></div>` : ''}

}

/* ════════════════ RAPORLAR ════════════════ */

async function raporCiz(bas, bit) {
  bas ||= bugun(); bit ||= bugun();
  baslikYaz('Raporlar', 'Ciro, ürün ve personel analizi', `
    <input type="date" id="rBas" value="${bas}" style="padding:6px 9px;border:1.5px solid var(--cizgi);border-radius:8px">

    <button class="btn btn-kucuk" onclick="raporCiz(document.getElementById('rBas').value,document.getElementById('rBit').value)">Getir</button>
    <button class="btn btn-cizgi btn-kucuk" onclick="raporHizli(7)">Son 7 gün</button>
    <button class="btn btn-cizgi btn-kucuk" onclick="raporHizli(30)">Son 30 gün</button>`);

  let r, gs;
