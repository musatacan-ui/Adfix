<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adfix — Merkez Yönetim</title>
<meta name="theme-color" content="#1F4E48">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231F4E48'/%3E%3Ctext y='68' x='50' font-size='52' text-anchor='middle' fill='%23D4921A' font-weight='700' font-family='Georgia,serif'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0C1F1B;--kart:#152D28;--kenar:rgba(255,255,255,.08);--yazi:#E8F5F2;--sol:#7AADA4;
      --teal:#2A7A6E;--teal-l:#3DA394;--yesil:#27AE60;--kirmizi:#E74C3C;--amber:#D4921A}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--yazi);
     min-height:100vh;display:flex;justify-content:center;padding:40px 16px}
.kapsam{max-width:760px;width:100%}
.page-header{text-align:center;margin-bottom:32px}
.logo{font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:700;color:var(--teal-l);margin-bottom:4px}
.logo span{color:var(--amber)}
.aciklama{color:var(--sol);font-size:13px;letter-spacing:.5px;text-transform:uppercase}
.kart{background:var(--kart);border:1px solid var(--kenar);border-radius:14px;padding:24px;margin-bottom:20px}
.kart h2{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--yazi)}
label{display:block;font-size:11px;font-weight:700;color:var(--sol);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
input,select{width:100%;padding:9px 12px;border:1px solid rgba(255,255,255,.12);border-radius:8px;
       background:rgba(255,255,255,.05);color:var(--yazi);font-size:14px;margin-bottom:12px;
       font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--teal-l)}
option{background:#152D28}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:none;
     border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.btn-mavi{background:var(--teal);color:#fff}.btn-mavi:hover{background:var(--teal-l)}
.btn-yesil{background:rgba(39,174,96,.15);color:var(--yesil);border:1px solid rgba(39,174,96,.25)}
.btn-yesil:hover{background:rgba(39,174,96,.25)}
.btn-kirmizi{background:rgba(231,76,60,.12);color:var(--kirmizi);border:1px solid rgba(231,76,60,.2)}
.btn-kirmizi:hover{background:rgba(231,76,60,.22)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hata{color:var(--kirmizi);font-size:13px;margin-top:4px}
.basari{color:var(--yesil);font-size:13px;margin-top:4px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--kenar);font-size:13px}
th{color:var(--sol);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tr:hover td{background:rgba(255,255,255,.02)}
.rozet{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:700}
.rozet-aktif{background:rgba(39,174,96,.15);color:var(--yesil)}
.rozet-pasif{background:rgba(231,76,60,.12);color:var(--kirmizi)}
a{color:var(--teal-l);text-decoration:none}a:hover{text-decoration:underline}
.row{display:flex;gap:12px}.row>*{flex:1}
#girisEkrani,#panelEkrani{display:none}
.bos{text-align:center;color:var(--sol);padding:24px;font-size:14px}
.btn-kucuk{padding:5px 12px;font-size:12px;border-radius:6px}
.btn-turuncu{background:rgba(212,146,26,.15);color:var(--amber);border:1px solid rgba(212,146,26,.25)}
.btn-turuncu:hover{background:rgba(212,146,26,.25)}
</style>
</head>
<body>
<div class="kapsam">
  <div class="page-header">
    <div class="logo">Adfix<span>.</span></div>
    <p class="aciklama">Merkez Yönetim Paneli</p>
  </div>

  <!-- GIRIS -->
  <div id="girisEkrani" class="kart">
    <h2>Giris</h2>
    <label>Super Yonetici Sifresi</label>
    <input type="password" id="sifre" placeholder="ADFIX_SUPER_SIFRE degerini girin"
           onkeydown="if(event.key==='Enter')girisYap()">
    <button class="btn btn-mavi" onclick="girisYap()">Giris Yap</button>
    <div id="girisHata" class="hata"></div>
  </div>

  <!-- PANEL -->
  <div id="panelEkrani">
    <div class="kart">
      <h2>Yeni Isletme Olustur</h2>
      <div class="row">
        <div>
          <label>Isletme Adi</label>
          <input type="text" id="yeniAd" placeholder="Ornek Kafe"
                 oninput="if(!slugElle)document.getElementById('yeniSlug').value=slugYap(this.value)">
        </div>
        <div>
          <label>URL Kodu (slug)</label>
          <input type="text" id="yeniSlug" placeholder="ornek-kafe"
                 oninput="slugElle=true;this.value=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'-')">
        </div>
      </div>
      <div class="row">
        <div>
          <label>Ilk Yonetici Sifresi</label>
          <input type="text" id="yeniSifre" value="adfix2026">
        </div>
        <div style="display:flex;align-items:flex-end">
          <button class="btn btn-yesil" onclick="isletmeOlustur()" style="width:100%">Olustur</button>
        </div>
      </div>
      <div id="olusturMesaj"></div>
    </div>

    <div class="kart">
      <h2>Isletmeler</h2>
      <div id="isletmeListe"><div class="bos">Yukleniyor...</div></div>
    </div>

    <div style="text-align:center;margin-top:16px">
      <button class="btn btn-kirmizi" onclick="cikis()">Cikis Yap</button>
    </div>
  </div>
</div>

<script>
const API = location.origin + '/api/merkez';
let TOKEN = localStorage.getItem('adfix_merkez_token');
let slugElle = false;

function slugYap(ad) {
  const tr = {'ç':'c','ş':'s','ğ':'g','ı':'i','ö':'o','ü':'u',
              'Ç':'c','Ş':'s','Ğ':'g','İ':'i','Ö':'o','Ü':'u'};
  return ad.toLowerCase().replace(/[çşğıöüÇŞĞİÖÜ]/g, c=>tr[c]||c)
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').substring(0,50);
}

function baslik(){ return {'Content-Type':'application/json','Authorization':'Bearer '+TOKEN}; }

async function istek(yol, sec={}) {
  const r = await fetch(API + yol, {...sec, headers:{...baslik(), ...(sec.headers||{})}});
  const g = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(g.detail || 'Hata ('+r.status+')');
  return g;
}

function goster(giris, panel) {
  document.getElementById('girisEkrani').style.display = giris ? 'block' : 'none';
  document.getElementById('panelEkrani').style.display = panel ? 'block' : 'none';
}

async function girisYap() {
  const el = document.getElementById('girisHata');
  el.textContent = '';
  try {
    const r = await fetch(API + '/giris', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({sifre: document.getElementById('sifre').value})
    });
    const g = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(g.detail || 'Hata');
    TOKEN = g.token;
    localStorage.setItem('adfix_merkez_token', TOKEN);
    goster(false, true);
    listeYukle();
  } catch(e) { el.textContent = e.message; }
}

async function listeYukle() {
  const el = document.getElementById('isletmeListe');
  try {
    const liste = await istek('/isletme/liste');
    if(!liste.length) { el.innerHTML='<div class="bos">Henuz isletme eklenmemis.</div>'; return; }
    let html = '<table><tr><th>Isletme</th><th>URL Kodu</th><th>Durum</th><th></th></tr>';
    for(const i of liste) {
      const durum = i.aktif
        ? '<span class="rozet rozet-aktif">Aktif</span>'
        : '<span class="rozet rozet-pasif">Pasif</span>';
      const url = location.origin + '/i/' + i.slug + '/';
      const toggleBtn = i.aktif
        ? `<button class="btn btn-kucuk btn-turuncu" onclick="isletmeToggle('${esc(i.slug)}',0)">Pasife Al</button>`
        : `<button class="btn btn-kucuk btn-yesil" onclick="isletmeToggle('${esc(i.slug)}',1)">Aktif Et</button>`;
      html += `<tr>
        <td><strong><a href="${url}" target="_blank">${esc(i.ad)}</a></strong></td>
        <td><code>${esc(i.slug)}</code></td>
        <td>${durum}</td>
        <td style="text-align:right;white-space:nowrap">
          ${toggleBtn}
          <button class="btn btn-kucuk btn-kirmizi" onclick="isletmeSil('${esc(i.slug)}','${esc(i.ad)}')">Sil</button>
        </td>
      </tr>`;
    }
    html += '</table>';
    el.innerHTML = html;
  } catch(e) {
    if(e.message.includes('401') || e.message.includes('oturum')) { cikis(); return; }
    el.innerHTML = '<div class="hata">'+esc(e.message)+'</div>';
  }
}

async function isletmeOlustur() {
  const el = document.getElementById('olusturMesaj');
  el.innerHTML = '';
  const ad = document.getElementById('yeniAd').value.trim();
  const slug = document.getElementById('yeniSlug').value.trim();
  const sifre = document.getElementById('yeniSifre').value.trim();
  if(!ad || !slug) { el.innerHTML='<div class="hata">Ad ve slug gerekli</div>'; return; }
  try {
    const r = await istek('/isletme/olustur', {
      method:'POST',
      body: JSON.stringify({ad, slug, ilk_sifre: sifre || 'adfix2026'})
    });
    const url = location.origin + '/i/' + r.slug + '/';
    el.innerHTML = `<div class="basari">${esc(r.mesaj)}<br>
      <a href="${url}" target="_blank">${url}</a></div>`;
    document.getElementById('yeniAd').value = '';
    document.getElementById('yeniSlug').value = '';
    slugElle = false;
    listeYukle();
  } catch(e) { el.innerHTML = '<div class="hata">'+esc(e.message)+'</div>'; }
}

async function isletmeToggle(slug, aktif) {
  try {
    await istek('/isletme/'+slug, {method:'PATCH',
      body:JSON.stringify({aktif})});
    listeYukle();
  } catch(e) { alert(e.message); }
}

async function isletmeSil(slug, ad) {
  if(!confirm(ad+' isletmesi kalici olarak silinecek.\nIsletmenin veritabani dosyasi (data/'+slug+'.db) sunucuda korunur.\n\nDevam edilsin mi?')) return;
  try {
    await istek('/isletme/'+slug, {method:'DELETE'});
    listeYukle();
  } catch(e) { alert(e.message); }
}

function cikis() {
  TOKEN = null;
  localStorage.removeItem('adfix_merkez_token');
  goster(true, false);
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// Baslangic — token varsa once dogrula
if(TOKEN) {
  fetch(API + '/isletme/liste', {headers: baslik()})
    .then(r => { if(!r.ok) throw new Error(); return r.json(); })
    .then(() => { goster(false, true); listeYukle(); })
    .catch(() => { cikis(); });
} else {
  goster(true, false);
}
</script>
</body>
</html>
